<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#090011" />
  <title>Ghost v0.7A</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div>
        <h1>Ghost</h1>
        <p>v0.7A Viewer Core</p>
      </div>
      <button id="newAlbumBtn" class="ghost-btn">+ Album</button>
    </header>

    <main id="homeScreen" class="screen active">
      <section class="panel">
        <div class="section-title">
          <h2>Albums</h2>
          <label class="ghost-btn file-btn">
            Add Photos
            <input id="photoInput" type="file" accept="image/*" multiple />
          </label>
        </div>
        <div id="albumGrid" class="album-grid"></div>
      </section>
    </main>

    <main id="albumScreen" class="screen">
      <div class="album-topbar">
        <button id="backToHome" class="icon-btn">←</button>
        <div>
          <h2 id="albumTitle">Album</h2>
          <p id="albumCount">0 photos</p>
        </div>
        <label class="ghost-btn file-btn small">
          Add
          <input id="albumPhotoInput" type="file" accept="image/*" multiple />
        </label>
      </div>
      <div id="photoGrid" class="photo-grid"></div>
    </main>

    <main id="viewerScreen" class="viewer">
      <div id="viewerTopbar" class="viewer-topbar">
        <button id="closeViewer" class="icon-btn">←</button>
        <span id="viewerCounter">1 / 1</span>
        <button id="viewerMenuBtn" class="icon-btn">⋮</button>
      </div>
      <div id="viewerMenu" class="viewer-menu hidden">
        <button id="setCoverBtn">⭐ Set Album Cover</button>
        <button id="movePhotoBtn">📁 Move Photo</button>
        <button id="deletePhotoBtn">🗑 Delete Photo</button>
        <button id="photoInfoBtn">ℹ Photo Info</button>
      </div>
      <img id="viewerImage" alt="Selected Ghost vault photo" />
    </main>
  </div>

  <dialog id="albumDialog">
    <form method="dialog" class="dialog-card">
      <h3>Create Album</h3>
      <input id="albumNameInput" placeholder="Album name" autocomplete="off" />
      <div class="dialog-actions">
        <button value="cancel" class="ghost-btn secondary">Cancel</button>
        <button id="createAlbumConfirm" value="default" class="ghost-btn">Create</button>
      </div>
    </form>
  </dialog>

  <dialog id="moveDialog">
    <form method="dialog" class="dialog-card">
      <h3>Move Photo</h3>
      <div id="moveAlbumList" class="move-list"></div>
      <div class="dialog-actions">
        <button value="cancel" class="ghost-btn secondary">Cancel</button>
      </div>
    </form>
  </dialog>

  <dialog id="infoDialog">
    <form method="dialog" class="dialog-card">
      <h3>Photo Info</h3>
      <div id="photoInfo" class="info-list"></div>
      <div class="dialog-actions">
        <button value="ok" class="ghost-btn">OK</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
