<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10051f">
<title>Ghost v3.0 Clean Foundation</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#05030b;--panel:#0d0917;--card:#120d20;--card2:#181027;--line:#7d32ff;--txt:#fff;--mut:#aaa2b7;--purple:#873cff;--glow:0 0 18px #873cff77,0 0 34px #873cff33}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(circle at top,#1e0b3c 0,#07030d 38%,#020204 100%);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--txt)}
button,input,textarea{font:inherit}
button,label{touch-action:manipulation}
.phone{max-width:430px;margin:0 auto;min-height:100vh;padding:18px 22px 104px;position:relative}
.screen{padding-bottom:90px;animation:fade .14s ease}
@keyframes fade{from{opacity:.55;transform:translateY(4px)}to{opacity:1;transform:none}}
.status{display:flex;justify-content:space-between;align-items:center;font-size:18px;font-weight:850;margin-bottom:12px}.icons{letter-spacing:2px}
.hidden{display:none!important}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}.top h1,.top h2{margin:0;font-size:25px}.iconBtn{width:42px;height:42px;border-radius:14px;border:1px solid #3b235c;background:#11101c;color:#fff;font-size:21px;display:grid;place-items:center}
.heroLogo{display:grid;place-items:center;text-align:center;margin:0 auto 16px}.heroLogo img{width:min(190px,56vw);filter:drop-shadow(0 0 12px #873cff88)}.ghostTitle{font-size:38px;letter-spacing:10px;font-weight:300;line-height:.9;margin:0;color:transparent;background:linear-gradient(180deg,#fff3ff,#c678ff 48%,#7a2cff);-webkit-background-clip:text;background-clip:text;text-shadow:0 0 8px #873cff66}.ghostSub{font-size:10.5px;letter-spacing:4.6px;color:#bd6dff;margin-top:9px}
.miniLogo{position:absolute;left:28px;top:70px;width:38px;height:38px;border-radius:12px;object-fit:cover;filter:drop-shadow(0 0 8px #873cffaa)}
.closeVault{position:absolute;right:25px;top:76px;background:transparent;border:0;color:#a95cff;font-size:36px;line-height:1}
.gearVault{position:absolute;right:72px;top:80px;width:34px;height:34px;border:1px solid #5b279088;border-radius:13px;background:#080511cc;color:#b86dff;display:grid;place-items:center}
.dashboard{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:15px}.dashBtn{min-height:112px;padding:14px 8px 11px;border-radius:19px;border:1px solid #642ba599;background:linear-gradient(180deg,rgba(10,8,18,.92),rgba(3,3,8,.98));box-shadow:inset 0 0 0 1px #ffffff06,0 7px 16px #0008;color:#fff;text-align:center}.dashBtn img{width:48px;height:48px;object-fit:contain}.dashBtn span{display:block;font-size:18px;font-weight:360}.dashBtn small{display:block;color:#c8bfd7;font-size:11px;margin-top:3px}.wide{grid-column:1/-1;display:grid;grid-template-columns:66px 1fr;align-items:center;text-align:left;min-height:82px;padding:12px 18px}
.bottomNav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom));width:min(386px,calc(100vw - 32px));z-index:999;background:rgba(5,4,12,.91);border:1px solid #5b279088;border-radius:28px;box-shadow:inset 0 0 9px #873cff0d,0 7px 18px #0009;display:grid;grid-template-columns:repeat(2,1fr);gap:4px;padding:9px 10px 8px;backdrop-filter:blur(12px)}
.bottomNav button{background:transparent;border:0;color:#ded7e9;font-size:12px;display:grid;gap:2px;place-items:center}.bottomNav img{width:26px;height:26px;object-fit:contain}
.vaultHero{border:1px solid #552681;background:linear-gradient(145deg,#181229,#090713);border-radius:24px;padding:14px;margin:4px 0 14px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px #0005}
.heroIcon{width:72px;height:72px;min-width:72px;border-radius:20px;overflow:hidden;background:#05030b;border:1px solid #7d32ff66;box-shadow:0 0 18px #873cff88,0 0 34px #873cff44}.heroIcon img{width:100%;height:100%;object-fit:cover;display:block}
.vaultHero h3{margin:0 0 4px;font-size:20px}.vaultHero p{margin:0;color:var(--mut);font-size:13px}
.heroActions{margin-left:auto;display:grid;gap:8px;min-width:112px}.heroActions label,.heroActions button{height:50px;border:0;border-radius:16px;background:linear-gradient(180deg,#a75bff,#6620ed);color:#fff;font-weight:900;box-shadow:0 0 15px #873cff77;display:grid;place-items:center;text-align:center;padding:0 12px}
.stats{border:1px solid #552681;background:linear-gradient(145deg,#181229,#090713);border-radius:20px;padding:12px;margin:8px 0 18px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.stats b{display:block;font-size:20px}.stats span{display:block;color:var(--mut);font-size:12px;margin-top:4px}
.albumGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:12px 0}.albumCard{position:relative;min-height:164px;border:1px solid #4b2574;border-radius:22px;overflow:hidden;background:linear-gradient(145deg,#181229,#090713);box-shadow:0 10px 30px #0006}.albumCover{height:112px;background:radial-gradient(circle at center,#2b1450,#090713 70%);display:grid;place-items:center;position:relative;font-size:42px}.albumCover img{width:100%;height:100%;object-fit:cover;display:block}.albumCover.locked::before{content:'🔒';position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(145deg,#13091f,#05030b);font-size:42px;text-shadow:0 0 18px #873cff}.playBubble{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:999px;background:#0009;border:1px solid #ffffff55;display:grid;place-items:center;z-index:2}
.albumInfo{padding:10px 12px;background:linear-gradient(transparent,rgba(0,0,0,.96));position:absolute;left:0;right:0;bottom:0}.albumInfo h3{margin:0 0 3px;font-size:17px;text-shadow:0 2px 8px #000}.albumInfo p{margin:0;color:#ddd;font-size:12px}
.dots{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:999px;background:#0009;color:#fff;border:1px solid #ffffff33;font-size:18px;z-index:5}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.tile{position:relative;border-radius:14px;overflow:hidden;background:#11101c;aspect-ratio:1;border:1px solid #211036}.tile img,.tile video{width:100%;height:100%;object-fit:cover;display:block}.tileMeta{position:absolute;left:0;right:0;bottom:0;padding:20px 7px 7px;background:linear-gradient(transparent,#000b);font-size:11px}.fav{position:absolute;left:7px;top:7px;width:28px;height:28px;border-radius:999px;background:#0009;border:1px solid #ffffff44;color:#fff;z-index:4}.fav.on{background:#a75bff}
.empty{text-align:center;color:var(--mut);padding:34px 14px}.empty .big{font-size:58px}
.actionRow{display:flex;gap:8px;margin:10px 0 14px}.actionRow button,.actionRow label{flex:1;text-align:center;border:1px solid #4b2574;background:#11101c;color:#fff;border-radius:16px;padding:12px 10px;font-weight:900}.actionRow .primary{background:linear-gradient(180deg,#a75bff,#6620ed)}
.modal{position:fixed;inset:0;background:#000c;z-index:1000;display:grid;place-items:center;padding:22px}.modalCard{background:#11101c;border:1px solid #873cff;border-radius:24px;padding:18px;width:100%;max-width:390px;box-shadow:0 0 30px #873cff88}.modalCard h2{margin:0 0 12px}.modalCard p{color:var(--mut);margin:0 0 12px}.choice{display:block;width:100%;background:#171126;border:1px solid #4b2574;color:white;border-radius:16px;padding:14px;margin:8px 0;text-align:left;font-weight:800}.choice.primary{background:linear-gradient(180deg,#a75bff,#6620ed);text-align:center}.modalInput{width:100%;margin:8px 0 10px;background:#080610;border:1px solid #7d32ff88;color:#fff;border-radius:15px;padding:14px 16px;outline:none;box-shadow:inset 0 0 12px #873cff22}.modalRow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.viewer{position:fixed;inset:0;background:#020204f7;z-index:1000;display:flex;flex-direction:column;touch-action:none}.viewerTop{height:64px;display:flex;align-items:center;gap:12px;padding:14px 16px;background:linear-gradient(#000b,transparent);z-index:2}.viewerTop button{width:42px;height:42px;border-radius:14px;border:1px solid #4b2574;background:#11101c;color:#fff;font-size:20px}.viewerTop strong{flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.viewerStage{flex:1;display:grid;place-items:center;overflow:hidden}.viewerStage img,.viewerStage video{max-width:100%;max-height:100%;border-radius:14px;background:#000}
.sheet{position:fixed;inset:0;background:#000b;z-index:1000;display:grid;align-items:end;padding:16px}.sheetCard{background:#090713;border:1px solid #5b2790;border-radius:24px;padding:14px;box-shadow:0 0 32px #000c}.sheetCard button,.sheetCard label{display:block;width:100%;background:#11101c;border:1px solid #2d174a;color:white;text-align:left;padding:14px 16px;font-weight:750;border-radius:14px;margin:7px 0}.danger{color:#ff6868!important;border-color:#5a1d34!important}
.inputArea{width:100%;min-height:220px;border-radius:18px;background:#10101a;border:1px solid #35204d;color:white;padding:16px;resize:vertical}
.listBtn{width:100%;text-align:left;border:0;border-radius:16px;background:#11101c;color:white;padding:16px;margin:8px 0;display:flex;gap:12px;align-items:center}
@media(max-width:390px){.phone{padding:16px 20px 104px}.heroLogo img{width:min(168px,52vw)}.ghostTitle{font-size:34px;letter-spacing:8.5px}.dashboard{gap:9px}.dashBtn{min-height:101px}.heroActions{min-width:96px}.heroActions label,.heroActions button{height:46px;font-size:13px}.albumGrid{gap:9px}.albumCard{min-height:146px}.albumCover{height:100px}}
</style>
</head>
<body>
<div id="app" class="phone"></div>
<div id="overlay" class="hidden"></div>
<script>
const GHOST_BUILD='v3.0-clean-foundation';
const app=document.querySelector('#app'), overlay=document.querySelector('#overlay');
const A={photo:['Library','Favourites','Family','Private'],video:['Library','Favourites','Family','Private']};
let state=JSON.parse(localStorage.ghostV3||localStorage.ghostStateV03||'{}');
state.setupDone=state.setupDone??true;state.disguise=state.disguise||'calculator';
state.photos=state.photos||[];state.videos=state.videos||[];state.files=state.files||[];state.notes=state.notes||[];state.contacts=state.contacts||[];
state.photoAlbums=state.photoAlbums||['Family','Private'];state.videoAlbums=state.videoAlbums||['Family','Private'];
state.albumCovers=state.albumCovers||{};state.videoCovers=state.videoCovers||{};
state.secureAlbums=state.secureAlbums||{};state.privateUnlocked=state.privateUnlocked||{};
let current='vault', activePhotoAlbum='Library', activeVideoAlbum='Library', selectedPhotos=[];
function save(){localStorage.ghostV3=JSON.stringify(state)}
function flash(t){let e=document.createElement('div');e.textContent=t;e.style.cssText='position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#171126;border:1px solid #8b3cff;color:#fff;border-radius:14px;padding:12px 18px;box-shadow:0 0 18px #873cff;z-index:2000;font-weight:800;text-align:center';document.body.appendChild(e);setTimeout(()=>e.remove(),1500)}
function shell(x){app.innerHTML=`<div class="screen"><div class="status"><span>9:41</span><span class="icons">▮▮▮ ᯤ ▭</span></div>${x}</div>`}
function bottom(){return `<div class="bottomNav"><button onclick="vault()"><img src="icon-home.svg">Home</button><button onclick="hideNow()"><img src="icon-hide.svg">Hide</button></div>`}
function cleanAlbums(){
 state.photoAlbums=[...new Set(['Family','Private',...(state.photoAlbums||[])])].filter(a=>!['Library','Favourites','Default','Work','Documents','All','All Photos'].includes(a));
 state.videoAlbums=[...new Set(['Family','Private',...(state.videoAlbums||[])])].filter(a=>!['Library','Favourites','Other','Travel','Downloads','Work'].includes(a));
 state.photos=(state.photos||[]).map(p=>{let o=typeof p==='string'?{src:p,album:'Private',fav:false,created:Date.now()}:Object.assign({album:'Private',fav:false,created:Date.now()},p);if(['Default','Work','Documents','Other'].includes(o.album)||!o.album)o.album='Private';o.fav=!!o.fav;return o});
 state.videos=(state.videos||[]).map(v=>{let o=Object.assign({album:'Library',fav:false,created:Date.now()},v);if(['Other','Travel','Downloads','Work'].includes(o.album)||!o.album)o.album='Private';o.fav=!!o.fav;return o});
 save();
}
cleanAlbums();
function hideNow(){overlay.className='hidden';calculator()}
function vault(){current='vault';shell(`<img class="miniLogo" src="ghost-main-logo.png"><button class="gearVault" onclick="settings()">⚙</button><button class="closeVault" onclick="hideNow()">×</button><section class="heroLogo"><img src="ghost-hero-target.png"><h1 class="ghostTitle">GHOST</h1><div class="ghostSub">— SECRET VAULT —</div></section><div class="dashboard"><button class="dashBtn" onclick="photosHome()"><img src="icon-photos.svg"><span>Photos</span><small>${state.photos.length} items</small></button><button class="dashBtn" onclick="videosHome()"><img src="icon-videos.svg"><span>Videos</span><small>${state.videos.length} items</small></button><button class="dashBtn" onclick="filesVault()"><img src="icon-files.svg"><span>Files</span><small>${state.files.length} files</small></button><button class="dashBtn" onclick="notesVault()"><img src="icon-notes.svg"><span>Notes</span><small>${state.notes.length} notes</small></button><button class="dashBtn wide" onclick="contactsVault()"><img src="icon-contacts.svg"><div><span>Contacts</span><small>${state.contacts.length} contacts</small></div></button></div>${bottom()}`)}
function calculator(){shell(`<h2 class="top">Calculator</h2><div style="height:92px;border-radius:20px;background:#05050a;border:1px solid #35204d;margin-bottom:14px;padding:18px;text-align:right;font-size:38px">0</div><p style="color:#aaa;text-align:center">Disguise mode</p>`)}
function photoAlbums(){return ['Library','Favourites',...state.photoAlbums]}
function videoAlbums(){return ['Library','Favourites',...state.videoAlbums]}
function emoji(a){return a==='Library'?'📚':a==='Favourites'?'⭐':a==='Family'?'👨‍👩‍👧':a==='Private'?'🔒':'📁'}
function protectedAlbum(a){return a==='Library'||a==='Favourites'}
function photoIndexes(a){if(a==='Library')return state.photos.map((_,i)=>i);if(a==='Favourites')return state.photos.map((p,i)=>p.fav?i:-1).filter(i=>i>=0);return state.photos.map((p,i)=>p.album===a?i:-1).filter(i=>i>=0)}
function videoIndexes(a){if(a==='Library')return state.videos.map((_,i)=>i);if(a==='Favourites')return state.videos.map((v,i)=>v.fav?i:-1).filter(i=>i>=0);return state.videos.map((v,i)=>v.album===a?i:-1).filter(i=>i>=0)}
function albumCover(type,a){let arr=type==='photo'?state.photos:state.videos, idxs=type==='photo'?photoIndexes(a):videoIndexes(a);let cover=(type==='photo'?state.albumCovers[a]:state.videoCovers[a]); if(cover)return cover; if(!idxs.length)return ''; let item=arr[idxs[idxs.length-1]]; return item.thumb||item.src||''}
function storageLabel(arr){let t=arr.reduce((s,x)=>s+(Number(x.size)||0),0);return !t?'0 MB':t<1048576?(t/1024).toFixed(1)+' KB':(t/1048576).toFixed(1)+' MB'}
function photosHome(){current='photos';cleanAlbums();let albums=photoAlbums();shell(`<div class="top"><button class="iconBtn" onclick="vault()">←</button><h2>Albums</h2><button class="iconBtn" style="margin-left:auto" onclick="settings()">⚙</button></div><div class="vaultHero"><div class="heroIcon"><img src="photos-portal-ghost.png"></div><div><h3>Ghost Photos</h3><p>${state.photos.length} photos stored</p></div><div class="heroActions"><label for="photoInput">+ Photo</label><button onclick="createAlbum('photo')">+ Album</button></div><input id="photoInput" type="file" accept="image/*" multiple hidden onchange="addPhotos(this.files)"></div><div class="stats"><div><b>${state.photos.length}</b><span>Photos</span></div><div><b>${albums.length}</b><span>Albums</span></div><div><b>${storageLabel(state.photos)}</b><span>Storage</span></div></div><div class="albumGrid">${albums.map(a=>albumCard('photo',a)).join('')}</div>${bottom()}`)}
function videosHome(){current='videos';cleanAlbums();let albums=videoAlbums();shell(`<div class="top"><button class="iconBtn" onclick="vault()">←</button><h2>Videos</h2><button class="iconBtn" style="margin-left:auto" onclick="settings()">⚙</button></div><div class="vaultHero"><div class="heroIcon"><img src="video-ghost-icon.png"></div><div><h3>Ghost Videos</h3><p>${state.videos.length} videos stored</p></div><div class="heroActions"><label for="videoInput">+ Video</label><button onclick="createAlbum('video')">+ Album</button></div><input id="videoInput" type="file" accept="video/*" multiple hidden onchange="addVideos(this.files)"></div><div class="stats"><div><b>${state.videos.length}</b><span>Videos</span></div><div><b>${albums.length}</b><span>Albums</span></div><div><b>${storageLabel(state.videos)}</b><span>Storage</span></div></div><div class="albumGrid">${albums.map(a=>albumCard('video',a)).join('')}</div>${bottom()}`)}
function albumCard(type,a){let count=(type==='photo'?photoIndexes(a):videoIndexes(a)).length, cover=albumCover(type,a), locked=state.secureAlbums[type+':'+a]?.hideCover&&!state.privateUnlocked[type+':'+a];return `<div class="albumCard" onclick="openAlbum('${type}','${a}')"><button class="dots" onclick="event.stopPropagation();albumMenu('${type}','${a}')">⋮</button><div class="albumCover ${locked?'locked':''}">${cover&&!locked?`<img src="${cover}">`:emoji(a)}${type==='video'?'<div class="playBubble">▶</div>':''}</div><div class="albumInfo"><h3>${emoji(a)} ${a}</h3><p>${count} ${type}${count===1?'':'s'}</p></div></div>`}
function openAlbum(type,a){let key=type+':'+a;if(state.secureAlbums[key]&&!state.privateUnlocked[key])return unlockAlbum(type,a);type==='photo'?openPhotoAlbum(a):openVideoAlbum(a)}
function openPhotoAlbum(a){activePhotoAlbum=a;let idxs=photoIndexes(a);shell(`<div class="top"><button class="iconBtn" onclick="photosHome()">←</button><h2>${emoji(a)} ${a}</h2><button class="iconBtn" style="margin-left:auto" onclick="albumMenu('photo','${a}')">⋮</button></div><div class="actionRow"><label class="primary" for="photoInput2">Upload</label><input id="photoInput2" type="file" accept="image/*" multiple hidden onchange="addPhotos(this.files,'${a}')"><button onclick="flash('Select mode coming next')">Select</button></div><div class="grid3">${idxs.map(i=>photoTile(i)).join('')}</div>${!idxs.length?`<div class="empty"><div class="big">👻</div><h3>No photos here yet</h3></div>`:''}${bottom()}`)}
function openVideoAlbum(a){activeVideoAlbum=a;let idxs=videoIndexes(a);shell(`<div class="top"><button class="iconBtn" onclick="videosHome()">←</button><h2>${emoji(a)} ${a}</h2><button class="iconBtn" style="margin-left:auto" onclick="albumMenu('video','${a}')">⋮</button></div><div class="actionRow"><label class="primary" for="videoInput2">Upload</label><input id="videoInput2" type="file" accept="video/*" multiple hidden onchange="addVideos(this.files,'${a}')"><button onclick="flash('Select mode coming next')">Select</button></div><div class="grid3">${idxs.map(i=>videoTile(i)).join('')}</div>${!idxs.length?`<div class="empty"><div class="big">👻</div><h3>No videos here yet</h3></div>`:''}${bottom()}`)}
function photoTile(i){let p=state.photos[i];return `<div class="tile" onclick="viewPhoto(${i})"><button class="fav ${p.fav?'on':''}" onclick="event.stopPropagation();pFav(${i})">★</button><img src="${p.src}"><div class="tileMeta">${p.album}</div></div>`}
function videoTile(i){let v=state.videos[i];return `<div class="tile" onclick="viewVideo(${i})"><button class="fav ${v.fav?'on':''}" onclick="event.stopPropagation();vFav(${i})">★</button><video src="${v.src}" muted preload="metadata"></video><div class="playBubble">▶</div><div class="tileMeta">${v.name||'Video'}</div></div>`}
function addPhotos(files,album){let arr=[...files||[]];if(!arr.length)return;let target=(album&&album!=='Library'&&album!=='Favourites')?album:'Private', done=0;arr.forEach(f=>{let r=new FileReader();r.onload=e=>{state.photos.push({src:e.target.result,album:target,fav:false,created:Date.now(),name:f.name,size:f.size,type:f.type});done++;if(done===arr.length){save();flash('Photos added');photosHome()}};r.readAsDataURL(f)})}
function addVideos(files,album){let arr=[...files||[]];if(!arr.length)return;let target=(album&&album!=='Library'&&album!=='Favourites')?album:'Private', done=0;arr.forEach(f=>{let r=new FileReader();r.onload=e=>{state.videos.push({src:e.target.result,album:target,fav:false,created:Date.now(),name:f.name,size:f.size,type:f.type});done++;if(done===arr.length){save();flash('Videos added');videosHome()}};r.readAsDataURL(f)})}
function pFav(i){state.photos[i].fav=!state.photos[i].fav;save();openPhotoAlbum(activePhotoAlbum)}
function vFav(i){state.videos[i].fav=!state.videos[i].fav;save();openVideoAlbum(activeVideoAlbum)}
function viewPhoto(i){let p=state.photos[i];overlay.className='viewer';overlay.innerHTML=`<div class="viewerTop"><button onclick="closeOverlay()">←</button><strong>${p.name||'Photo'}</strong><button onclick="pFav(${i});viewPhoto(${i})">★</button></div><div class="viewerStage"><img src="${p.src}"></div>`}
function viewVideo(i){let v=state.videos[i];overlay.className='viewer';overlay.innerHTML=`<div class="viewerTop"><button onclick="closeOverlay()">←</button><strong>${v.name||'Video'}</strong><button onclick="vFav(${i});viewVideo(${i})">★</button><button onclick="itemMenu('video',${i})">⋯</button></div><div class="viewerStage"><video src="${v.src}" controls autoplay playsinline></video></div>`}
function closeOverlay(){overlay.className='hidden';overlay.innerHTML=''}
function createAlbum(type){modal(`<h2>Create ${type==='photo'?'Photo':'Video'} Album</h2><input id="newAlbum" class="modalInput" placeholder="Album name"><div class="modalRow"><button class="choice" onclick="closeOverlay()">Cancel</button><button class="choice primary" onclick="saveAlbum('${type}')">Create</button></div>`)}
function saveAlbum(type){let n=document.querySelector('#newAlbum').value.trim();if(!n)return flash('Add a name');if(['Library','Favourites','Default','Other'].includes(n))return flash('Protected name');let list=type==='photo'?state.photoAlbums:state.videoAlbums;if(!list.includes(n))list.push(n);save();closeOverlay();type==='photo'?photosHome():videosHome()}
function albumMenu(type,a){let locked=protectedAlbum(a);let key=type+':'+a;let sec=state.secureAlbums[key];modal(`<h2>${emoji(a)} ${a}</h2>${locked?'<button class="choice">Protected Album</button>':`<button class="choice" onclick="renameAlbum('${type}','${a}')">Rename Album</button><button class="choice" onclick="deleteAlbum('${type}','${a}')">Delete Album</button><button class="choice" onclick="toggleSecure('${type}','${a}')">${sec?'Remove Private Lock':'Make Private / Lock'}</button>`}<button class="choice" onclick="closeOverlay()">Cancel</button>`)}
function renameAlbum(type,a){modal(`<h2>Rename Album</h2><input id="renameAlbum" class="modalInput" value="${a}"><div class="modalRow"><button class="choice" onclick="closeOverlay()">Cancel</button><button class="choice primary" onclick="saveRename('${type}','${a}')">Save</button></div>`)}
function saveRename(type,a){let n=document.querySelector('#renameAlbum').value.trim();if(!n||['Library','Favourites'].includes(n))return flash('Protected name');let list=type==='photo'?state.photoAlbums:state.videoAlbums;list[list.indexOf(a)]=n;(type==='photo'?state.photos:state.videos).forEach(x=>{if(x.album===a)x.album=n});save();closeOverlay();type==='photo'?photosHome():videosHome()}
function deleteAlbum(type,a){if(!confirm('Delete album? Contents move to Private.'))return;(type==='photo'?state.photos:state.videos).forEach(x=>{if(x.album===a)x.album='Private'});let list=type==='photo'?state.photoAlbums:state.videoAlbums;let k=list.indexOf(a);if(k>-1)list.splice(k,1);save();closeOverlay();type==='photo'?photosHome():videosHome()}
function toggleSecure(type,a){let key=type+':'+a;if(state.secureAlbums[key])delete state.secureAlbums[key];else state.secureAlbums[key]={pass:'1234',hideCover:true};save();closeOverlay();flash(state.secureAlbums[key]?'Private lock added':'Private lock removed')}
function unlockAlbum(type,a){let key=type+':'+a;modal(`<h2>🔒 ${a}</h2><p>Enter album passcode.</p><input id="albumPass" class="modalInput" type="password" placeholder="Passcode"><button class="choice primary" onclick="checkAlbumPass('${type}','${a}')">Unlock</button><button class="choice" onclick="closeOverlay()">Cancel</button>`)}
function checkAlbumPass(type,a){let key=type+':'+a,p=document.querySelector('#albumPass').value;if(p===(state.secureAlbums[key]?.pass||'1234')){state.privateUnlocked[key]=true;save();closeOverlay();openAlbum(type,a)}else flash('Wrong passcode')}
function modal(inner){overlay.className='modal';overlay.onclick=e=>{if(e.target===overlay)closeOverlay()};overlay.innerHTML=`<div class="modalCard" onclick="event.stopPropagation()">${inner}</div>`}
function settings(){modal(`<h2>Ghost v3.0</h2><p>Clean foundation build.</p><button class="choice" onclick="closeOverlay()">Close</button>`)}
function filesVault(){shell(`<div class="top"><button class="iconBtn" onclick="vault()">←</button><h2>Files</h2></div><button class="listBtn">📁 Secure Files</button>${bottom()}`)}
function notesVault(){shell(`<div class="top"><button class="iconBtn" onclick="vault()">←</button><h2>Notes</h2></div><textarea class="inputArea" placeholder="Secure notes coming next..."></textarea>${bottom()}`)}
function contactsVault(){shell(`<div class="top"><button class="iconBtn" onclick="vault()">←</button><h2>Contacts</h2></div><button class="listBtn">👤 Secure Contacts</button>${bottom()}`)}
vault();
