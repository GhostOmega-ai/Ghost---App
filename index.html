osition:sticky;top:0;z-index:30;background:#090611f2;border:1px solid #4b2574;border-radius:20px;padding:10px;margin-bottom:12px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px #0007;backdrop-filter:blur(12px)}.selectBar strong{flex:1}.selectBar button{border:0;background:#171126;color:white;border-radius:13px;padding:10px 12px;font-weight:800}.selectBar .danger{background:#ff514f}.viewerClean{position:fixed;inset:0;background:#020204f7;z-index:60;display:flex;flex-direction:column;touch-action:none}.viewerCleanTop{height:64px;display:flex;align-items:center;gap:12px;padding:14px 16px;background:linear-gradient(#000b,transparent);z-index:2}.viewerCleanTop button{width:42px;height:42px;border-radius:14px;border:1px solid #4b2574;background:#11101c;color:white;font-size:22px}.viewerCount{flex:1;text-align:center;font-weight:900}.viewerCount small{display:block;color:#aaa;font-weight:500;font-size:12px;margin-top:2px}.viewerStage{flex:1;display:grid;place-items:center;overflow:hidden}.viewerStage img{max-width:100%;max-height:100%;border-radius:14px;transition:transform .08s;transform-origin:center center}.cleanMenu{position:fixed;right:16px;top:66px;background:#11101c;border:1px solid #7d32ff;border-radius:18px;z-index:90;overflow:hidden;box-shadow:0 10px 32px #000b}.cleanMenu button{display:block;width:220px;background:transparent;border:0;color:white;text-align:left;padding:15px 16px;font-weight:750}.cleanMenu button+button{border-top:1px solid #2d174a}.albumModal{position:fixed;inset:0;background:#000c;z-index:95;display:grid;place-items:center;padding:22px}.albumModalCard{background:#11101c;border:1px solid #873cff;border-radius:24px;padding:18px;width:100%;max-width:390px;box-shadow:0 0 30px #873cff88}.albumChoice{display:block;width:100%;background:#171126;border:1px solid #4b2574;color:white;border-radius:16px;padding:14px;margin:8px 0;text-align:left;font-weight:800}.emptyGallery{text-align:center;padding:36px 16px;color:#aaa2b7}.emptyGallery .bi function normalizePhotos(){
  state.albumCovers=state.albumCovers||{};
  const protectedNames=['Library','All','All Photos','Favourites','Default','Work','Documents'];
  state.albums=(state.albums||[]).filter(a=>a && !protectedNames.includes(a));
  ['Family','Private'].forEach(a=>{if(!state.albums.includes(a))state.albums.push(a)});
  state.albums=['Family','Private',...state.albums.filter(a=>!['Family','Private'].includes(a))];

  state.photos=(state.photos||[]).map(p=>{
    let obj=typeof p==='string'
      ? {src:p,album:'Private',fav:false,created:Date.now()}
      : Object.assign({album:'Private',fav:false,created:Date.now()},p);
    if(!obj.album || obj.album==='Default' || obj.album==='Work' || obj.album==='Documents') obj.album='Private';
    obj.fav=!!obj.fav;
    return obj;
  });

  if(state.albumCovers['Default']){
    state.albumCovers['Private']=state.albumCovers['Private']||state.albumCovers['Default'];
    delete state.albumCovers['Default'];
  }
  delete state.albumCovers['Work'];
  delete state.albumCovers['Documents'];
  if(state.activeAlbum==='Default'||state.activeAlbum==='Work'||state.activeAlbum==='Documents')state.activeAlbum='Private';
}
function photoId(){return 'p_'+Date.now()+'_'+Math.random().toString(36).slice(2)}
function openGhostPhotoDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open('GhostPhotoDBStable',1);req.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains('photos'))db.createObjectStore('photos',{keyPath:'id'})};req.onsuccess=e=>resolve(e.target.result);req.onerror=e=>reject(e)})}
async function dbPutPhoto(id,data){const db=await openGhostPhotoDB();return new Promise((resolve,reject)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').put({id,data});tx.oncomplete=()=>resolve();tx.onerror=e=>reject(e)})}
async function dbGetPhoto(id){const db=await openGhostPhotoDB();return new Promise((resolve,reject)=>{const tx=db.transaction('photos','readonly');const req=tx.objectStore('photos').get(id);req.onsuccess=()=>resolve(req.result?req.result.data:null);req.onerror=e=>reject(e)})}
async function dbDeletePhoto(id){const db=await openGhostPhotoDB();return new Promise((resolve,reject)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').delete(id);tx.oncomplete=()=>resolve();tx.onerror=e=>reject(e)})}
async function ensurePhotoStorage(){
  state.albumCovers=state.albumCovers||{};
  const fixed=[];
  let changed=false;
  for(const p of (state.photos||[])){
    if(typeof p==='string'){
      const id=photoId();
      await dbPutPhoto(id,p);
      fixed.push({id,album:'Private',fav:false,created:Date.now()});
      changed=true;
    }else if(p&&p.src){
      const id=p.id||photoId();
      await dbPutPhoto(id,p.src);
      let album=p.album||'Private';
      if(album==='Default'||album==='Work'||album==='Documents')album='Private';
      fixed.push({id,album,fav:!!p.fav,created:p.created||Date.now(),name:p.name||'',size:p.size||0,type:p.type||'',lastModified:p.lastModified||0,width:p.width,height:p.height});
      changed=true;
    }else if(p&&p.id){
      let obj=Object.assign({album:'Private',fav:false,created:Date.now()},p);
      if(!obj.album||obj.album==='Default'||obj.album==='Work'||obj.album==='Documents'){obj.album='Private';changed=true}
      obj.fav=!!obj.fav;
      fixed.push(obj);
    }
  }
  state.photos=fixed;
  normalizePhotos();
  if(changed)save();
}

function albumPhotoIndexes(album){

function filteredPhotoIndexes(){

  return state.photos.map((p,i)=>({p,i})).filter(x=>(x.p.album||'Private')===a).map(x=>x.i);

  if(!name){flash('Add an album name');return}

async function deleteAlbumConfirm(album,mode){
  if(protectedPhotoAlbum(album))return flash('Protected album');
  if(mode==='all'){
    if(!confirm('Delete album and every photo inside?'))return;
    const ids=state.photos.filter(p=>p.album===album).map(p=>p.id);
    for(const id of ids){await dbDeletePhoto(id)}
    state.photos=state.photos.filter(p=>p.album!==album);
  }else{
    // Library is smart/all photos, so store moved contents under Private.
    state.photos.forEach(p=>{if(p.album===album)p.album='Private'});
  }
  state.albums=state.albums.filter(a=>a!==album);
  delete state.albumCovers[album];
  state.activeAlbum='Library';
  save();
  closeAlbumModal();
  drawPhotos();
}

function finishAlbumMove(mode,album){

    selectedPhotos=[];

function videoId(){return 'v_'+Date.now()+'_'+Math.random().toString(36).slice(2)}
function ensureVideoVault(){
  state.videos=state.videos||[];
  const coreAlbums=['Library','Favourites','Family','Private'];
  const oldDefaults=['Travel','Downloads','Work','Private'];
  let existing=Array.isArray(state.videoAlbums)?state.videoAlbums:[];
  existing=existing.filter(a=>a && !oldDefaults.includes(a));
  coreAlbums.forEach(a=>{if(!existing.includes(a))existing.push(a)});
  state.videoAlbums=[
    ...coreAlbums,
    ...existing.filter(a=>!coreAlbums.includes(a))
  ];
  state.videoActiveAlbum=state.videoActiveAlbum||'Albums';
  state.videos=state.videos.map(function(v){
    if(!v.album)v.album='Library';
    if(oldDefaults.includes(v.album))v.album='Private';
    if(v.album!=='Library' && v.album!=='Favourites' && !state.videoAlbums.includes(v.album))state.videoAlbums.push(v.album);
    v.fav=!!v.fav;
    v.created=v.created||Date.now();
    return v;
  });
  save();
}
function openGhostVideoDB(){
  return new Promise(function(resolve,reject){
    const req=indexedDB.open('GhostVideoDBStable',1);
    req.onupgradeneeded=function(e){
      const db=e.target.result;
      if(!db.objectStoreNames.contains('videos'))db.createObjectStore('videos',{keyPath:'id'});
    };
    req.onsuccess=function(e){resolve(e.target.result)};
    req.onerror=function(e){reject(e)};
  });
}
async function dbPutVideo(id,data){
  const db=await openGhostVideoDB();
  return new Promise(function(resolve,reject){
    const tx=db.transaction('videos','readwrite');
    tx.objectStore('videos').put({id:id,data:data});
    tx.oncomplete=function(){resolve()};
    tx.onerror=function(e){reject(e)};
  });
}
async function dbGetVideo(id){
  const db=await openGhostVideoDB();
  return new Promise(function(resolve,reject){
    const tx=db.transaction('videos','readonly');
    const req=tx.objectStore('videos').get(id);
    req.onsuccess=function(){resolve(req.result?req.result.data:null)};
    req.onerror=function(e){reject(e)};
  });
}
async function dbDeleteVideo(id){

async function getVideoThumbnail(i){
  const v=state.videos[i];
  if(!v)return videoGhostFallback();
  if(v.thumb)return v.thumb;
  const src=await dbGetVideo(v.id);
  if(!src)return videoGhostFallback();
  return new Promise(function(resolve){
    const vid=document.createElement('video');
    vid.muted=true;
    vid.playsInline=true;
    vid.preload='metadata';
    let settled=false;
    function done(url){
      if(settled)return;
      settled=true;
      v.thumb=url||videoGhostFallback();
      save();
      resolve(v.thumb);
    }
    vid.onloadeddata=function(){
      try{
        const seek=Math.min(0.25, Math.max(0, (vid.duration||1)/8));
        vid.currentTime=seek;
      }catch(e){capture()}
    };
    vid.onseeked=capture;
    vid.onerror=function(){done(videoGhostFallback())};
    function capture(){
      try{
        const canvas=document.createElement('canvas');
        canvas.width=320;
        canvas.height=180;
        const ctx=canvas.getContext('2d');
        ctx.fillStyle='#05030b';
        ctx.fillRect(0,0,canvas.width,canvas.height);
        const vw=vid.videoWidth||320, vh=vid.videoHeight||180;
        const scale=Math.max(canvas.width/vw, canvas.height/vh);
        const w=vw*scale, h=vh*scale;
        ctx.drawImage(vid,(canvas.width-w)/2,(canvas.height-h)/2,w,h);
        done(canvas.toDataURL('image/jpeg',0.72));
      }catch(e){
        done(videoGhostFallback());
      }
    }
    setTimeout(function(){done(videoGhostFallback())},2500);
    vid.src=src;
  });
}

function ghostNormalPhotoAlbum(){

  return 'Family';

function normalizePhotos(){
  state.albumCovers=state.albumCovers||{};
  const protectedNames=['Library','All','All Photos','Favourites','Default','Work','Documents'];
  state.albums=(state.albums||[]).filter(a=>a && !protectedNames.includes(a));
  ['Family','Private'].forEach(a=>{if(!state.albums.includes(a))state.albums.push(a)});
  state.albums=['Family','Private',...state.albums.filter(a=>!['Family','Private'].includes(a))];

  state.photos=(state.photos||[]).map(p=>{
    let obj=typeof p==='string'
      ? {src:p,album:ghostNormalPhotoAlbum(),fav:false,created:Date.now()}
      : Object.assign({album:ghostNormalPhotoAlbum(),fav:false,created:Date.now()},p);
    if(!obj.album || obj.album==='Default' || obj.album==='Work' || obj.album==='Documents') obj.album=ghostNormalPhotoAlbum();
    obj.fav=!!obj.fav;
    return obj;
  });

  if(state.albumCovers['Default']){
    state.albumCovers['Family']=state.albumCovers['Family']||state.albumCovers['Default'];
    delete state.albumCovers['Default'];
  }
  delete state.albumCovers['Work'];
  delete state.albumCovers['Documents'];
  if(state.activeAlbum==='Default'||state.activeAlbum==='Work'||state.activeAlbum==='Documents')state.activeAlbum='Family';
}
async function ensurePhotoStorage(){
  state.albumCovers=state.albumCovers||{};
  const fixed=[];
  let changed=false;
  for(const p of (state.photos||[])){
    if(typeof p==='string'){
      const id=photoId();
      await dbPutPhoto(id,p);
      fixed.push({id,album:ghostNormalPhotoAlbum(),fav:false,created:Date.now()});
      changed=true;
    }else if(p&&p.src){
      const id=p.id||photoId();
      await dbPutPhoto(id,p.src);
      let album=p.album||ghostNormalPhotoAlbum();
      if(album==='Default'||album==='Work'||album==='Documents')album=ghostNormalPhotoAlbum();
      fixed.push({id,album,fav:!!p.fav,created:p.created||Date.now(),name:p.name||'',size:p.size||0,type:p.type||'',lastModified:p.lastModified||0,width:p.width,height:p.height});
      changed=true;
    }else if(p&&p.id){
      let obj=Object.assign({album:ghostNormalPhotoAlbum(),fav:false,created:Date.now()},p);
      if(!obj.album||obj.album==='Default'||obj.album==='Work'||obj.album==='Documents'){obj.album=ghostNormalPhotoAlbum();changed=true}
      obj.fav=!!obj.fav;
      fixed.push(obj);
    }
  }
  state.photos=fixed;
  normalizePhotos();
  if(changed)save();
}
async function addPhotos(files){
  if(!files||!files.length)return;
  await ensurePhotoStorage();
  const targetAlbum=ghostNormalPhotoAlbum();
  const list=[...files];
  let remaining=list.length;
  for(const file of list){
    const reader=new FileReader();
    reader.onload=async e=>{
      const id=photoId();
      await dbPutPhoto(id,e.target.result);
      state.photos.push({
        id,
        album:targetAlbum,
        fav:false,
        created:Date.now(),
        name:file.name||'Photo',
        size:file.size||0,
        type:file.type||'image',
        lastModified:file.lastModified||0
      });
      remaining--;
      if(remaining===0){
        save();
        await drawPhotos();
        flash('Photo added');
      }
    };
    reader.onerror=()=>{remaining--; if(remaining===0){save();drawPhotos()}};
    reader.readAsDataURL(file);
  }
}

function v33Rename(i){const v=v33VideoArray()[i];if(!v)return;const n=prompt('Video name',v33Name(v));if(n&&n.trim()){v.name=n.trim();v33Save();document.querySelectorAll('.v33SheetBack').forEach(x=>x.remove());v33Render()}}
function v33MoveMenu(indexes){document.querySelectorAll('.v33SheetBack').forEach(x=>x.remove());const back=document.createElement('div');back.className='v33SheetBack';back.onclick=e=>{if(e.target===back)back.remove()};const albums=v33Albums().filter(a=>a!=='Favourites');back.innerHTML=`<div class="v33Sheet" onclick="event.stopPropagation()"><button class="v33Close" onclick="this.closest('.v33SheetBack').remove()">×</button><h2>Move Video${indexes.length>1?'s':''}</h2><p>Choose where the selected video${indexes.length>1?'s':''} should live.</p>${albums.map(a=>`<button class="primary" onclick="v33Move([${indexes.join(',')}],'${String(a).replace(/'/g,"\\'")}')">${v33Esc(a)}</button>`).join('')}</div>`;document.body.appendChild(back)}
function v33Move(indexes,album){const anyPrivate=indexes.some(i=>v33Private((v33VideoArray()[i]||{}).album));if(anyPrivate&&!v33Private(album))return v33MoveWarn(indexes,album);indexes.forEach(i=>{const v=v33VideoArray()[i];if(v){v.album=album;if(v33Private(album)){v.fav=false;v.favorite=false;v.favourite=false}}});state.selectedVideos=[];v33Save();document.querySelectorAll('.v33SheetBack').forEach(x=>x.remove());flash(v33Private(album)?'Moved to Private':'Video moved');v33Render()}
function v33MoveWarn(indexes,album){document.querySelectorAll('.v33SheetBack').forEach(x=>x.remove());const back=document.createElement('div');back.className='v33SheetBack';back.onclick=e=>{if(e.target===back)back.remove()};back.innerHTML=`<div class="v33Sheet" onclick="event.stopPropagation()"><button class="v33Close" onclick="this.closest('.v33SheetBack').remove()">×</button><h2>Remove from Private?</h2><p>The selected video${indexes.length>1?'s':''} will no longer be hidden once moved out of the Private album.</p><button onclick="this.closest('.v33SheetBack').remove()">Cancel</button><button class="primary" onclick="v33ForceMove([${indexes.join(',')}],'${String(album).replace(/'/g,"\\'")}')">Move Out</button></div>`;document.body.appendChild(back)}
function v33ForceMove(indexes,album){indexes.forEach(i=>{const v=v33VideoArray()[i];if(v){v.album=album;v.fav=false;v.favorite=false;v.favourite=false}});state.selectedVideos=[];v33Save();document.querySelectorAll('.v33SheetBack').forEach(x=>x.remove());flash('Video is no longer hidden');v33Render()}
function v33Delete(indexes){if(!confirm('Delete selected video'+(indexes.length>1?'s':'')+'?'))return;state.videos=v33VideoArray().filter((_,i)=>!indexes.includes(i));state.selectedVideos=[];v33Save();document.querySelectorAll('.v33SheetBack').forEach(x=>x.remove());flash('Deleted');v33Render()}
function v33MultiFav(){(state.selectedVideos||[]).forEach(i=>{const v=v33VideoArray()[i];if(v&&!v33Private(v.album))v.fav=true});state.selectedVideos=[];v33Save();flash('Favourites added');v33Render()}
function v33CreateAlbum(){const n=prompt('New video album name');if(n&&n.trim())v33SetAlbum(n.trim())}
function v33AlbumOptions(){v33CreateAlbum()}
function v33Upload(files){const arr=[...files||[]];if(!arr.length)return;arr.forEach(file=>{const url=URL.createObjectURL(file);v33VideoArray().push({name:file.name,album:v33Album()==='Library'?'Family':v33Album(),url:url,src:url,size:file.size,created:Date.now(),fav:false})});v33Save();v33Render()}
/* Replace old Video Vault entry points */
function videos(){v33Render()}function drawVideoVault(){v33Render()}function drawVideoAlbum(){v33Render()}function videoAlbumIndexes(album){return v33Indexes(album)}function videoFilteredIndexes(){return v33Indexes()}function filteredVideoIndexes(){return v33Indexes()}function toggleVideoFav(i){v33Fav(i)}function toggleVideoFavourite(i){v33Fav(i)}function toggleVideoFavorite(i){v33Fav(i)}function openVideoMoveMenu(i){v33MoveMenu([i])}function videoMoveMenu(i){v33MoveMenu([i])}function moveVideoToAlbum(i,a){v33Move([i],a)}function moveVideo(i){v33MoveMenu([i])}

</script>
</body>
