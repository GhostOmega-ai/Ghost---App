osition:sticky;top:0;z-index:30;background:#090611f2;border:1px solid #4b2574;border-radius:20px;padding:10px;margin-bottom:12px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px #0007;backdrop-filter:blur(12px)}.selectBar strong{flex:1}.selectBar button{border:0;background:#171126;color:white;border-radius:13px;padding:10px 12px;font-weight:800}.selectBar .danger{background:#ff514f}.viewerClean{position:fixed;inset:0;background:#020204f7;z-index:60;display:flex;flex-direction:column;touch-action:none}.viewerCleanTop{height:64px;display:flex;align-items:center;gap:12px;padding:14px 16px;background:linear-gradient(#000b,transparent);z-index:2}.viewerCleanTop button{width:42px;height:42px;border-radius:14px;border:1px solid #4b2574;background:#11101c;color:white;font-size:22px}.viewerCount{flex:1;text-align:center;font-weight:900}.viewerCount small{display:block;color:#aaa;font-weight:500;font-size:12px;margin-top:2px}.viewerStage{flex:1;display:grid;place-items:center;overflow:hidden}.viewerStage img{max-width:100%;max-height:100%;border-radius:14px;transition:transform .08s;transform-origin:center center}.cleanMenu{position:fixed;right:16px;top:66px;background:#11101c;border:1px solid #7d32ff;border-radius:18px;z-index:90;overflow:hidden;box-shadow:0 10px 32px #000b}.cleanMenu button{display:block;width:220px;background:transparent;border:0;color:white;text-align:left;padding:15px 16px;font-weight:750}.cleanMenu button+button{border-top:1px solid #2d174a}.albumModal{position:fixed;inset:0;background:#000c;z-index:95;display:grid;place-items:center;padding:22px}.albumModalCard{background:#11101c;border:1px solid #873cff;border-radius:24px;padding:18px;width:100%;max-width:390px;box-shadow:0 0 30px #873cff88}.albumChoice{display:block;width:100%;background:#171126;border:1px solid #4b2574;color:white;border-radius:16px;padding:14px;margin:8px 0;text-align:left;font-weight:800}.emptyGallery{text-align:center;padding:36px 16px;color:#aaa2b7}.emptyGallery .bi state.notes=state.notes||[]; state.files=state.files||[]; state.contacts=state.contacts||[]; state.photos=state.photos||[]; state.videos=state.videos||[]; state.videoAlbums=state.videoAlbums||['Library','Favourites','Family','Travel','Downloads','Work']; state.videoActiveAlbum=state.videoActiveAlbum||'Albums'; state.albums=state.albums||['Default','Family','Private','Work','Documents']; state.activeAlbum=state.activeAlbum||'Library'; state.albumCovers=state.albumCovers||{}; let selectedPhotos=[]; let selectMode=false; let isPickingPhotos=false;

function shell(inner){app.innerHTML=`<div class="screen"><div class="status"><span>9:41</span><span class="icons">▮▮▮ ᯤ ▭</span></div>${inner}</div>`}

function chooseDisguise(){current='setup';const opts=[['calculator','🧮','Calculator','Unlock with a secret calculation'],['weather','🌤️','Weather','Unlock with a secret weather sequence'],['calendar','📅','Calendar','Unlock with a secret date'],['notes','🗒️','Notes','Unlock with a hidden word'],['files','📁','Files','Unlock with a secret folder']];shell(`<div class="topbar"><button class="back" onclick="welcome()">←</button></div>${ghost('small')}<h1 class="title">Choose your<br><span class="grad">disguise</span></h1><p class="sub">This becomes the front page after setup.</p>${opts.map(o=>`<div class="option ${state.disguise==o[0]?'selected':''}" onclick="state.disguise='${o[0]}';save();chooseDisguise()"><div class="miniIcon">${o[1]}</div><div><h3>${o[2]}</h3><p>${o[3]}</p></div><div class="radio"></div></div>`).join('')}<button class="btn" onclick="unlockSetup()">Continue →</button>`)}
function unlockSetup(){current='setup';let d=state.disguise;let content='';if(d==='calculator')content=`<h1 class="title">Calculator<br><span class="grad">unlock</span></h1><p class="sub">Example: 7777= or 1234+</p><input id="unlockInput" class="input" value="${state.unlock.calculator}" placeholder="Secret calculator code">`;if(d==='weather')content=`<h1 class="title">Weather<br><span class="grad">sequence</span></h1><p class="sub">Type a sequence using sun, cloud, rain, storm.</p><input id="unlockInput" class="input" value="${state.unlock.weather.join(',')}" placeholder="sun,cloud,rain">`;if(d==='calendar')content=`<h1 class="title">Calendar<br><span class="grad">date</span></h1><p class="sub">Choose one date or sequence.</p><input id="unlockInput" class="input" value="${state.unlock.calendar.join(',')}" placeholder="28 or 7,14,21">`;if(d==='notes')content=`<h1 class="title">Notes<br><span class="grad">secret word</span></h1><p class="sub">Typing this word in the decoy notes unlocks Ghost.</p><input id="unlockInput" class="input" value="${state.unlock.notes}" placeholder="ghostmode">`;if(d==='files')content=`<h1 class="title">Files<br><span class="grad">secret folder</span></h1><p class="sub">Opening this fake folder unlocks Ghost.</p><input id="unlockInput" class="input" value="${state.unlock.files}" placeholder="Invoices 2026">`;shell(`<div class="topbar"><button class="back" onclick="chooseDisguise()">←</button></div>${ghost('small')}${content}<button class="btn" onclick="saveUnlock()">Create Vault →</button>`)}
function saveUnlock(){let v=document.querySelector('#unlockInput').value.trim();if(!v)return alert('Add an unlock method');let d=state.disguise;if(d==='calculator')state.unlock.calculator=v;if(d==='weather')state.unlock.weather=v.split(',').map(x=>x.trim().toLowerCase()).filter(Boolean);if(d==='calendar')state.unlock.calendar=v.split(',').map(x=>x.trim()).filter(Boolean);if(d==='notes')state.unlock.notes=v;if(d==='files')state.unlock.files=v;state.setupDone=true;save();created()}
function created(){current='created';shell(`${ghost()}<h1 class="title">Vault<br><span class="grad">created</span></h1><p class="sub">From now on, Ghost opens as your disguise.</p><div class="card"><p>Disguise: <b>${state.disguise}</b></p><p>Status: <b style="color:#8dffb1">Hidden</b></p></div><button class="btn" onclick="hideNow()">Open Disguise →</button>`)}
function disguiseApp(){current='disguise'; if(state.disguise==='weather')return weatherApp(); if(state.disguise==='calendar')return calendarApp(); if(state.disguise==='notes')return notesDecoy(); if(state.disguise==='files')return filesDecoy(); return calcApp()}
function calcApp(){calcVal='';shell(`<div class="fakeTitle">Calculator</div><div class="calcDisplay" id="display">0</div><div class="calcGrid">${['C','÷','×','⌫','7','8','9','-','4','5','6','+','1','2','3','=','0','.','%','GO'].map(x=>`<button class="${'+-×÷='.includes(x)||x=='GO'?'op':''} ${x=='='?'eq':''}" onclick="calcPress('${x}')">${x}</button>`).join('')}</div><p class="privacyNote">Standard calculator</p>`)}

function weatherApp(){weatherSeq=[];shell(`<div class="fakeTitle">Weather</div><div class="card" style="text-align:center"><div style="font-size:72px">🌤️</div><h1>18°C</h1><p>Partly cloudy</p></div><div class="weatherCards">${[['sun','☀️','Sun'],['cloud','☁️','Cloud'],['rain','🌧️','Rain'],['storm','⛈️','Storm']].map(w=>`<div class="wCard" onclick="weatherTap('${w[0]}')">${w[1]}<br>${w[2]}</div>`).join('')}</div>`)}
function weatherTap(w){weatherSeq.push(w);let target=state.unlock.weather.join(',');if(weatherSeq.slice(-state.unlock.weather.length).join(',')===target)vault()}
function calendarApp(){calendarSeq=[];let d=new Date(),days=Array.from({length:31},(_,i)=>i+1);shell(`<div class="fakeTitle">Calendar</div><h2 style="text-align:center">${d.toLocaleString('default',{month:'long'})} ${d.getFullYear()}</h2><div class="calendarGrid">${days.map(day=>`<button class="day" onclick="calendarTap('${day}')">${day}</button>`).join('')}</div>`)}
function calendarTap(day){calendarSeq.push(day);let target=state.unlock.calendar.join(',');if(calendarSeq.slice(-state.unlock.calendar.length).join(',')===target)vault()}
function notesDecoy(){shell(`<div class="fakeTitle">Notes</div><textarea id="dnote" class="noteArea" placeholder="Start typing..."></textarea><button class="btn" onclick="checkNote()">Save</button>`)}

function filesDecoy(){let folders=['Downloads','Pictures','Documents','Music','Invoices 2026','Receipts'];shell(`<div class="fakeTitle">Files</div><div class="fileList">${folders.map(f=>`<button onclick="fileOpen('${f}')">📁 ${f}</button>`).join('')}</div>`)}

function vault(){current='vault';shell(`<div class="vaultPage v21Dash"><img class="vaultMiniLogo" src="ghost-main-logo.png" alt="Ghost"><button class="vaultGear" onclick="settings()">⚙</button><button class="vaultClose" onclick="hideNow()">×</button><section class="targetHero"><img class="targetHeroGhost" src="ghost-hero-target.png" alt="Ghost"><h1 class="targetGhostTitle">GHOST</h1><div class="targetGhostSub">— SECRET VAULT —</div></section><div class="vaultDashGrid v21Grid"><div class="vaultBtn" onclick="photos()"><div class="big"><img src="icon-photos.svg" alt=""></div><span>Photos</span><small>${(state.photos||[]).length} Items</small></div><div class="vaultBtn" onclick="videosVault()"><div class="big"><img src="icon-videos.svg" alt=""></div><span>Videos</span><small>${(state.videos||[]).length} Items</small></div><div class="vaultBtn" onclick="filesVault()"><div class="big"><img src="icon-files.svg" alt=""></div><span>Files</span><small>${(state.files||[]).length} Items</small></div><div class="vaultBtn" onclick="notesVault()"><div class="big"><img src="icon-notes.svg" alt=""></div><span>Notes</span><small>${(state.notes||[]).length} Notes</small></div><div class="vaultBtn contactWide" onclick="contactsVault()"><div class="big"><img src="icon-contacts.svg" alt=""></div><span>Contacts</span><small>${(state.contacts||[]).length} Contacts</small></div></div>${nav()}</div>`)}

function normalizePhotos(){state.photos=(state.photos||[]).map(p=>typeof p==='string'?{src:p,album:'Default',fav:false,created:Date.now()}:Object.assign({album:'Default',fav:false,created:Date.now()},p));if(!state.albums.includes('Default'))state.albums.unshift('Default');state.albumCovers=state.albumCovers||{}}

function openGhostPhotoDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open('GhostPhotoDBStable',1);req.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains('photos'))db.createObjectStore('photos',{keyPath:'id'})};req.onsuccess=e=>resolve(e.target.result);req.onerror=e=>reject(e)})}

async function dbGetPhoto(id){const db=await openGhostPhotoDB();return new Promise((resolve,reject)=>{const tx=db.transaction('photos','readonly');const req=tx.objectStore('photos').get(id);req.onsuccess=()=>resolve(req.result?req.result.data:null);req.onerror=e=>reject(e)})}
async function dbDeletePhoto(id){const db=await openGhostPhotoDB();return new Promise((resolve,reject)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').delete(id);tx.oncomplete=()=>resolve();tx.onerror=e=>reject(e)})}
async function ensurePhotoStorage(){state.albums=state.albums||['Default','Family','Private','Work','Documents'];state.albumCovers=state.albumCovers||{};if(!state.albums.includes('Default'))state.albums.unshift('Default');const fixed=[];let changed=false;for(const p of (state.photos||[])){if(typeof p==='string'){const id=photoId();await dbPutPhoto(id,p);fixed.push({id,album:'Default',fav:false,created:Date.now()});changed=true}else if(p&&p.src){const id=p.id||photoId();await dbPutPhoto(id,p.src);fixed.push({id,album:p.album||'Default',fav:!!p.fav,created:p.created||Date.now()});changed=true}else if(p&&p.id){fixed.push(Object.assign({album:'Default',fav:false,created:Date.now()},p))}}state.photos=fixed;if(changed)save()}
async function photos(){current='photos';await ensurePhotoStorage();selectedPhotos=[];selectMode=false;if(!state.activeAlbum)state.activeAlbum='Library';await drawPhotos()}
function albumEmoji(a){return (a==='Library'||a==='All'||a==='All Photos')?'📚':a==='Family'?'👨‍👩‍👧':a==='Private'?'🔒':a==='Work'?'💼':a==='Documents'?'📄':a==='Default'?'🗂️':'📁'}

function albumPhotoIndexes(album){if(album==='Library')return state.photos.map((_,i)=>i);return state.photos.map((p,i)=>({p,i})).filter(x=>(x.p.album||'Default')===album).map(x=>x.i)}

async function deleteAlbumConfirm(album,mode){if(mode==='all'){if(!confirm('Delete album and every photo inside?'))return;const ids=state.photos.filter(p=>p.album===album).map(p=>p.id);for(const id of ids){await dbDeletePhoto(id)}state.photos=state.photos.filter(p=>p.album!==album)}else{state.photos.forEach(p=>{if(p.album===album)p.album='Default'})}state.albums=state.albums.filter(a=>a!==album);delete state.albumCovers[album];state.activeAlbum='Library';save();closeAlbumModal();drawPhotos()}

function addPhotos(files){isPickingPhotos=false;const selected=Array.from(files||[]);if(!selected.length){flash('No photos selected');return}const uploadAlbum=((state.activeAlbum==='Library'||state.activeAlbum==='All'||state.activeAlbum==='All Photos')?'Default':state.activeAlbum);flash('Uploading '+selected.length+' photo'+(selected.length>1?'s':'')+' to '+uploadAlbum+'...');let done=0,metas=[];selected.forEach(file=>{const reader=new FileReader();reader.onload=async e=>{if(e.target&&e.target.result){const id=photoId();const data=e.target.result;let meta={id,album:uploadAlbum,created:Date.now(),fav:false,name:file.name||'',size:file.size||0,type:file.type||'',lastModified:file.lastModified||0};try{const img=new Image();img.onload=async()=>{meta.width=img.naturalWidth;meta.height=img.naturalHeight;await dbPutPhoto(id,data);metas.push(meta);if(!state.albumCovers[uploadAlbum])state.albumCovers[uploadAlbum]=id;done++;finishPhotoUpload(done,selected.length,metas,uploadAlbum)};img.onerror=async()=>{await dbPutPhoto(id,data);metas.push(meta);if(!state.albumCovers[uploadAlbum])state.albumCovers[uploadAlbum]=id;done++;finishPhotoUpload(done,selected.length,metas,uploadAlbum)};img.src=data;return}catch(err){await dbPutPhoto(id,data);metas.push(meta);if(!state.albumCovers[uploadAlbum])state.albumCovers[uploadAlbum]=id}}done++;finishPhotoUpload(done,selected.length,metas,uploadAlbum)};reader.onerror=()=>{done++;finishPhotoUpload(done,selected.length,metas,uploadAlbum)};reader.readAsDataURL(file)})}

let viewerScale=1,viewerX=0,viewerY=0,viewerOriginX=50,viewerOriginY=50;
function applyViewerTransform(){const img=document.querySelector('#viewerImg');if(img){img.style.transformOrigin=viewerOriginX+'% '+viewerOriginY+'%';img.style.transform=`translate(${viewerX}px,${viewerY}px) scale(${viewerScale})`}}

function setupViewerGestures(){viewerScale=1;viewerX=0;viewerY=0;viewerOriginX=50;viewerOriginY=50;applyViewerTransform();const stage=document.querySelector('#viewerStage');let sx=0,sy=0,startX=0,startY=0,startScale=1,startDist=0,lastTap=0,tapTimer=null;stage.ontouchstart=e=>{if(tapTimer){clearTimeout(tapTimer);tapTimer=null}if(e.touches.length===1){sx=e.touches[0].clientX;sy=e.touches[0].clientY;startX=viewerX;startY=viewerY}if(e.touches.length===2){let a=e.touches[0],b=e.touches[1];let dx=a.clientX-b.clientX,dy=a.clientY-b.clientY;startDist=Math.sqrt(dx*dx+dy*dy);startScale=viewerScale;const rect=stage.getBoundingClientRect();const mx=(a.clientX+b.clientX)/2;const my=(a.clientY+b.clientY)/2;viewerOriginX=((mx-rect.left)/rect.width)*100;viewerOriginY=((my-rect.top)/rect.height)*100;applyViewerTransform()}};stage.ontouchmove=e=>{e.preventDefault();if(e.touches.length===1&&viewerScale>1){viewerX=startX+(e.touches[0].clientX-sx);viewerY=startY+(e.touches[0].clientY-sy);applyViewerTransform()}if(e.touches.length===2&&startDist){let a=e.touches[0],b=e.touches[1];let dx=a.clientX-b.clientX,dy=a.clientY-b.clientY;let dist=Math.sqrt(dx*dx+dy*dy);viewerScale=Math.max(1,Math.min(5,startScale*(dist/startDist)));applyViewerTransform()}};stage.ontouchend=e=>{if(!e.changedTouches.length)return;const now=Date.now();const dx=e.changedTouches[0].clientX-sx;const dy=e.changedTouches[0].clientY-sy;const moved=Math.abs(dx)>18||Math.abs(dy)>18;if(now-lastTap<280&&!moved){if(tapTimer){clearTimeout(tapTimer);tapTimer=null}const rect=stage.getBoundingClientRect();viewerOriginX=((sx-rect.left)/rect.width)*100;viewerOriginY=((sy-rect.top)/rect.height)*100;viewerScale=viewerScale>1?1:2.5;viewerX=0;viewerY=0;applyViewerTransform();lastTap=0;return}lastTap=now;if(viewerScale<=1&&Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)){if(dx>65)prevViewerPhoto();if(dx<-65)nextViewerPhoto();return}if(viewerScale<=1&&!moved){tapTimer=setTimeout(()=>{toggleViewerUI();tapTimer=null},285)}};stage.onclick=e=>{if(!('ontouchstart' in window))toggleViewerUI()}}

function formatBytes(bytes){bytes=Number(bytes)||0;if(bytes<1024)return bytes+' B';if(bytes<1024*1024)return (bytes/1024).toFixed(1)+' KB';if(bytes<1024*1024*1024)return (bytes/1024/1024).toFixed(1)+' MB';return (bytes/1024/1024/1024).toFixed(2)+' GB'}

function rawAlbumIndexes(album){normalizePhotos();if(album==='Library'||album==='All'||album==='All Photos'||!album)return state.photos.map((_,i)=>i);if(album==='Favourites')return state.photos.map((p,i)=>({p,i})).filter(x=>x.p.fav).map(x=>x.i);return state.photos.map((p,i)=>({p,i})).filter(x=>(x.p.album||'Default')===album).map(x=>x.i)}

function sortIndexes(idxs){const mode=state.photoSort||'newest';return idxs.slice().sort((a,b)=>{const pa=state.photos[a]||{},pb=state.photos[b]||{};if(mode==='oldest')return (pa.created||0)-(pb.created||0);if(mode==='az')return photoName(pa,a).localeCompare(photoName(pb,b));if(mode==='za')return photoName(pb,b).localeCompare(photoName(pa,a));return (pb.created||0)-(pa.created||0)})}

function albumEmoji(a){return a==='Favourites'?'⭐':(a==='Library'||a==='All'||a==='All Photos')?'📚':a==='Family'?'👨‍👩‍👧':a==='Private'?'🔒':a==='Work'?'💼':a==='Documents'?'📄':a==='Default'?'🗂️':'📁'}
async function cleanupAlbumCovers(){state.albumCovers=state.albumCovers||{};const valid=new Set(state.photos.map(p=>p.id));let changed=false;for(const album of state.albums){const cover=state.albumCovers[album];const idxs=rawAlbumIndexes(album);const coverOk=cover&&valid.has(cover)&&idxs.some(i=>state.photos[i].id===cover);if(!coverOk){if(idxs.length)state.albumCovers[album]=state.photos[sortIndexes(idxs)[0]].id;else delete state.albumCovers[album];changed=true}}if(changed)save()}
async function albumCoverSrc(album){await cleanupAlbumCovers();if(album==='Favourites'){const favs=sortIndexes(rawAlbumIndexes('Favourites'));return favs.length?await photoSrc(favs[0]):''}const coverId=state.albumCovers&&state.albumCovers[album];if(coverId){const s=await dbGetPhoto(coverId);if(s)return s}const idxs=sortIndexes(rawAlbumIndexes(album));if(!idxs.length)return '';return await photoSrc(idxs[0])}

function videoId(){return 'v_'+Date.now()+'_'+Math.random().toString(36).slice(2)}
function ensureVideoVault(){
  state.videos=state.videos||[];
  state.videoAlbums=state.videoAlbums||['Library','Favourites','Family','Travel','Downloads','Work'];
  if(!state.videoAlbums.includes('Library'))state.videoAlbums.unshift('Library');
  if(!state.videoAlbums.includes('Favourites'))state.videoAlbums.splice(1,0,'Favourites');
  state.videoActiveAlbum=state.videoActiveAlbum||'Albums';
  state.videos=state.videos.map(function(v){
    v.album=v.album||'Library';
    v.fav=!!v.fav;
    v.created=v.created||Date.now();
    return v;
  });
  save();
}
function openGhostVideoDB(){
  return new Promise(function(resolve,reject){
    const req=indexedDB.open('GhostVideoDBStable',1);
    req.onupgradeneeded=function(e){
      const db=e.target.result;
      if(!db.objectStoreNames.contains('videos'))db.createObjectStore('videos',{keyPath:'id'});
    };
    req.onsuccess=function(e){resolve(e.target.result)};
    req.onerror=function(e){reject(e)};
  });
}
async function dbPutVideo(id,data){
  const db=await openGhostVideoDB();
  return new Promise(function(resolve,reject){
    const tx=db.transaction('videos','readwrite');
    tx.objectStore('videos').put({id:id,data:data});
    tx.oncomplete=function(){resolve()};
    tx.onerror=function(e){reject(e)};
  });
}
async function dbGetVideo(id){
  const db=await openGhostVideoDB();
  return new Promise(function(resolve,reject){
    const tx=db.transaction('videos','readonly');
    const req=tx.objectStore('videos').get(id);
    req.onsuccess=function(){resolve(req.result?req.result.data:null)};
    req.onerror=function(e){reject(e)};
  });
}
async function dbDeleteVideo(id){
  const db=await openGhostVideoDB();
  return new Promise(function(resolve,reject){
    const tx=db.transaction('videos','readwrite');
    tx.objectStore('videos').delete(id);
    tx.oncomplete=function(){resolve()};
    tx.onerror=function(e){reject(e)};
  });
}
function formatVideoSize(bytes){
  bytes=Number(bytes)||0;
  if(bytes<1024)return bytes+' B';
  if(bytes<1024*1024)return (bytes/1024).toFixed(1)+' KB';
  if(bytes<1024*1024*1024)return (bytes/1024/1024).toFixed(1)+' MB';
  return (bytes/1024/1024/1024).toFixed(2)+' GB';
}
function totalVideoSize(){return (state.videos||[]).reduce(function(a,v){return a+(Number(v.size)||0)},0)}
function videoAlbumIndexes(album){
  ensureVideoVault();
  if(album==='Library')return state.videos.map(function(_,i){return i});
  if(album==='Favourites')return state.videos.map(function(v,i){return v.fav?i:-1}).filter(function(i){return i>=0});
  return state.videos.map(function(v,i){return v.album===album?i:-1}).filter(function(i){return i>=0});
}

  if(album==='Library')return '🎬';

  if(album==='Travel')return '✈️';
  if(album==='Downloads')return '⬇️';
  if(album==='Work')return '💼';
  return '📁';
}

function addVideos(files){
  ensureVideoVault();
  const selected=Array.from(files||[]);
  if(!selected.length){flash('No videos selected');return}
  flash('Importing '+selected.length+' video'+(selected.length>1?'s':'')+'...');
  let done=0, metas=[];
  selected.forEach(function(file){
    const reader=new FileReader();
    reader.onload=async function(e){
      if(e.target&&e.target.result){
        const id=videoId();
        await dbPutVideo(id,e.target.result);
        metas.push({id:id,name:file.name||'Video',size:file.size||0,type:file.type||'video',created:Date.now(),album:'Library',fav:false,duration:'--:--'});
      }
      done++;
      if(done===selected.length){
        state.videos=(state.videos||[]).concat(metas);
        save();
        flash(metas.length+' video'+(metas.length!==1?'s':'')+' added');
        setTimeout(function(){drawVideoAlbums()},150);
      }
    };
    reader.onerror=function(){
      done++;
      if(done===selected.length){state.videos=(state.videos||[]).concat(metas);save();drawVideoAlbums();}
    };
    reader.readAsDataURL(file);
  });
}

    <button onclick="moveVideo(${i})">📁 Move</button>
    <button onclick="toggleVideoFav(${i})">${v.fav?'★ Remove Favourite':'☆ Add to Favourites'}</button>
    <button class="danger" onclick="deleteVideo(${i},true)">🗑 Delete</button>
  </div>`;
}
function closeVideoSheet(){viewer.className='hidden';viewer.innerHTML=''}
async function openVideoPlayer(i){
  const v=state.videos[i];
  if(!v)return;
  const src=await dbGetVideo(v.id);
  if(!src){alert('Video file missing from device storage');return}
  viewer.className='videoPlayer';
  viewer.innerHTML=`<div class="videoPlayerTop"><button onclick="closeVideoPlayer()">←</button><strong>${v.name||'Video'}</strong><button onclick="toggleVideoFav(${i})">${v.fav?'★':'☆'}</button><button onclick="openVideoSheet(${i})">⋯</button></div>
  <video src="${src}" controls playsinline autoplay></video>
  <div class="ghostPlayerBar"><button onclick="closeVideoPlayer()">Back</button><button onclick="renameVideo(${i})">Rename</button><button onclick="moveVideo(${i})">Move</button></div>`;
}
function closeVideoPlayer(){viewer.className='hidden';viewer.innerHTML=''; if(state.videoActiveAlbum&&state.videoActiveAlbum!=='Albums')drawVideoAlbum(state.videoActiveAlbum);else drawVideoAlbums();}
function renameVideo(i){
  const v=state.videos[i]; if(!v)return;
  const name=prompt('Video name?',v.name||('Video '+(i+1)));
  if(!name)return;
  v.name=name.trim();
  save();
  if(viewer.className==='videoPlayer')openVideoPlayer(i);else if(viewer.className==='videoSheetBack')openVideoSheet(i);else drawVideoAlbum(state.videoActiveAlbum||'Library');
}
function moveVideo(i){
  ensureVideoVault();
  const v=state.videos[i]; if(!v)return;
  const choices=state.videoAlbums.filter(function(a){return a!=='Favourites'});
  const msg='Move to album:\\n\\n'+choices.map(function(a,n){return (n+1)+'. '+a}).join('\\n');
  const pick=prompt(msg, String(Math.max(1,choices.indexOf(v.album)+1)));
  if(!pick)return;
  const num=parseInt(pick,10);
  if(!num||!choices[num-1]){alert('Album not found');return}
  v.album=choices[num-1];
  save();
  flash('Moved to '+v.album);
  closeVideoSheet();
  drawVideoAlbum(state.videoActiveAlbum||v.album);
}
function toggleVideoFav(i){
  const v=state.videos[i]; if(!v)return;
  v.fav=!v.fav;
  save();
  flash(v.fav?'Added to favourites':'Removed from favourites');
  if(viewer.className==='videoPlayer')openVideoPlayer(i);
  else if(viewer.className==='videoSheetBack')openVideoSheet(i);
  else drawVideoAlbum(state.videoActiveAlbum||'Library');
}
async function deleteVideo(i,fromSheet){
  const v=state.videos[i]; if(!v)return;
  if(!confirm('Delete this video from Ghost?'))return;
  await dbDeleteVideo(v.id);
  state.videos.splice(i,1);
  save();
  viewer.className='hidden';viewer.innerHTML='';
  drawVideoAlbum(state.videoActiveAlbum||'Library');
}
function videoAlbumMenu(album){
  if(album==='Library'||album==='Favourites'){
    alert(album+' is a smart album and cannot be renamed or deleted.');
    return;
  }
  const action=prompt(album+' options:\\n\\n1. Rename album\\n2. Delete album\\n3. New album','1');
  if(action==='1'){
    const n=prompt('New album name?',album);
    if(!n)return;
    state.videos.forEach(function(v){if(v.album===album)v.album=n.trim()});
    state.videoAlbums=state.videoAlbums.map(function(a){return a===album?n.trim():a});
    save(); drawVideoAlbums();
  }else if(action==='2'){
    if(!confirm('Delete album? Videos will move to Library.'))return;
    state.videos.forEach(function(v){if(v.album===album)v.album='Library'});
    state.videoAlbums=state.videoAlbums.filter(function(a){return a!==album});
    save(); drawVideoAlbums();
  }else if(action==='3'){
    newVideoAlbum();
  }
}
function newVideoAlbum(){
  ensureVideoVault();
  const n=prompt('Album name?','New Album');
  if(!n)return;
  const name=n.trim();
  if(!name)return;
  if(state.videoAlbums.includes(name)){alert('Album already exists');return}
  state.videoAlbums.push(name);
  save();
  drawVideoAlbums();
}
function videoInfo(){alert('Ghost Videos v2.2\nStored videos: '+((state.videos||[]).length)+'\nStorage: device browser database')}

/* Ghost v2.1 safe boot */
function ghostRenderFallback(title,msg,button){
  var appEl=document.querySelector('#app'); if(!appEl){return;}
  appEl.innerHTML='<div class="screen"><div class="status"><span>9:41</span><span class="icons">▮▮▮ ᯤ ▭</span></div><h1 class="title"><span class="grad">'+title+'</span></h1><p class="sub">'+msg+'</p>'+(button||'')+'</div>';
}
function ghostSafeBoot(){
  try{
    if(typeof state==='undefined'){ghostRenderFallback('GHOST','State failed to load.','<button class="btn" onclick="location.reload()">Reload</button>');return;}
    if(!state.setupDone && typeof welcome==='function'){welcome();return;}
    if(typeof disguiseApp==='function'){disguiseApp();return;}
    ghostRenderFallback('GHOST','Boot fallback loaded.','<button class="btn" onclick="location.reload()">Reload</button>');
  }catch(e){
    var safeMsg=String((e&&e.message)?e.message:e).replace(/[<>&]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c]});
    ghostRenderFallback('GHOST','Boot error: '+safeMsg,'<button class="btn" onclick="localStorage.removeItem(&quot;ghostStateV03&quot;);location.reload()">Reset State</button>');
  }
}
window.addEventListener('DOMContentLoaded',ghostSafeBoot);
setTimeout(function(){try{var a=document.querySelector('#app');if(a&&!a.innerHTML.trim())ghostSafeBoot();}catch(e){}},300);

</script>
