<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10051f">
<title>Ghost</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#05030b;--card:#11101cdd;--card2:#171126;--line:#7d32ff;--txt:#fff;--mut:#aaa6b8;--red:#ff514f;--green:#38d67a;--purple:#873cff;--glow:0 0 18px #873cff,0 0 38px #873cff55}
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(circle at top,#1e0b3c 0,#07030d 35%,#020204 100%);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--txt);min-height:100vh;overscroll-behavior:none}
button,input,textarea{font:inherit}
.phone{max-width:430px;margin:0 auto;min-height:100vh;padding:22px 22px 30px;position:relative}
.status{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:18px;margin-bottom:24px}.icons{letter-spacing:2px}
.ghost{width:96px;height:96px;margin:0 auto 24px;display:block;filter:drop-shadow(0 0 18px #823cff)}.ghost.small{width:66px;height:66px}
.title{text-align:center;font-size:42px;line-height:1.05;font-weight:900;margin:0}
.grad{background:linear-gradient(180deg,#e7c8ff,#7a30ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;color:#c5bfd2;font-size:18px;line-height:1.45;margin:16px auto 26px}.hint{color:#aaa2b7;margin:12px 0}
.card{background:linear-gradient(160deg,#151126dd,#090713dd);border:1px solid #5a279966;border-radius:20px;padding:18px;box-shadow:inset 0 0 0 1px #ffffff08,0 10px 40px #0008}
.btn{width:100%;border:0;border-radius:22px;margin-top:18px;padding:19px 22px;background:linear-gradient(180deg,#a75bff,#6620ed);color:white;font-size:21px;font-weight:850;box-shadow:var(--glow);display:flex;justify-content:center;gap:12px;align-items:center}
.btn.dark{background:#151126;box-shadow:none;border:1px solid #3b235c}.btn.danger{background:#ff514f;box-shadow:0 0 18px #ff514f66}
.foot{text-align:center;color:#9e96ad;margin-top:20px;line-height:1.35}.hidden{display:none!important}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.back{font-size:34px;color:#a35cff;background:0;border:0}
.option{display:grid;grid-template-columns:70px 1fr 32px;gap:14px;align-items:center;padding:13px;border:1px solid #351852;border-radius:18px;background:#0e0b18;margin:12px 0}
.option.selected{border-color:#9b4dff;box-shadow:0 0 18px #8d3fff88}.miniIcon{width:60px;height:60px;border-radius:18px;background:#111;border:2px solid #913fff;box-shadow:0 0 13px #873cff;display:grid;place-items:center;font-size:30px}
.radio{width:26px;height:26px;border-radius:50%;border:3px solid #67557b}.selected .radio{background:#a358ff;border-color:#a358ff;box-shadow:0 0 15px #a358ff}
.option h3{margin:0 0 5px;font-size:21px}.option p{margin:0;color:#b8b1c5}
.input{width:100%;padding:18px;border-radius:16px;background:#080610;border:2px solid #8b3cff;color:#fff;box-shadow:0 0 14px #843cff55;font-size:18px}
.appHead{display:flex;align-items:center;gap:12px;margin-bottom:18px}.appHead img{width:42px;height:42px}.appHead h2{margin:0}.appHead .spacer{margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.vaultBtn{border-radius:18px;background:#11101c;border:1px solid #2c164c;padding:17px 8px;text-align:center;min-height:98px}.vaultBtn .big{font-size:30px;color:#a258ff;margin-bottom:8px}
.nav{position:sticky;bottom:0;margin:20px -8px -8px;padding:10px;background:#090611d9;border:1px solid #2e164d;border-radius:22px;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;backdrop-filter:blur(12px)}.nav button{background:0;border:0;color:#bdb5ca;font-size:12px}.nav .nI{display:block;font-size:24px;color:#8f45ff}
.calcDisplay{height:92px;border-radius:20px;background:#05050a;border:1px solid #35204d;margin-bottom:14px;padding:18px;text-align:right;font-size:38px;overflow:hidden}.calcGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.calcGrid button{height:64px;border:0;border-radius:18px;background:#1b1a23;color:white;font-size:24px;font-weight:700}.calcGrid .op{background:#33234b;color:#c79bff}.calcGrid .eq{background:linear-gradient(180deg,#974eff,#611ee4)}
.fakeTitle{text-align:center;font-weight:800;font-size:22px;margin-bottom:15px}.noteArea{width:100%;min-height:250px;border-radius:18px;background:#10101a;border:1px solid #35204d;color:white;padding:16px;resize:vertical}
.fileList button,.contactList button{width:100%;text-align:left;border:0;border-radius:16px;background:#11101c;color:white;padding:16px;margin:8px 0;display:flex;gap:12px;align-items:center}
.calendarGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{height:42px;border-radius:12px;background:#11101c;border:1px solid #231339;color:white}.day.sel{background:#8b3cff}
.weatherCards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.wCard{border:1px solid #2c164c;background:#11101c;border-radius:18px;padding:18px;text-align:center}
.picGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.picGrid img{width:100%;aspect-ratio:1;border-radius:12px;object-fit:cover}
.viewer{position:fixed;inset:0;background:#020204f5;z-index:50;display:flex;flex-direction:column;padding:18px;touch-action:pan-y}
.viewerTop{display:flex;align-items:center;gap:10px}.viewerTop button{background:#171126;border:1px solid #6d35b8;color:white;border-radius:14px;padding:10px 14px}.viewerImgWrap{flex:1;display:grid;place-items:center;overflow:auto}.viewerImgWrap img{max-width:100%;max-height:76vh;border-radius:18px;box-shadow:0 0 30px #873cff88;transition:transform .15s}.viewerActions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.viewerActions button{border:0;border-radius:16px;padding:15px;color:white;background:#171126}.viewerActions .danger{background:#ff514f}.viewerActions .release{background:#26381f}
.browserBar{display:flex;gap:8px;margin:12px 0}.browserBar input{flex:1;background:#15151e;border:1px solid #3b235c;border-radius:16px;color:white;padding:13px}.webFrame{height:380px;border-radius:18px;background:#0e0e16;border:1px solid #2c164c;overflow:auto;padding:20px}.google{text-align:center;font-size:44px;font-weight:800;margin:35px 0 20px}.searchPill{background:#20202b;border-radius:24px;padding:15px;color:#a8a2b5;text-align:left;margin:12px 0}.privacyNote{font-size:13px;color:#958aa6;text-align:center;margin-top:12px}
.screen{animation:fade .16s}@keyframes fade{from{opacity:.55;transform:translateY(4px)}to{opacity:1;transform:none}}

.albumBar{display:flex;gap:8px;overflow:auto;margin:12px 0 14px;padding-bottom:4px}
.albumChip{white-space:nowrap;border:1px solid #5a2799;background:#11101c;color:#ddd;border-radius:999px;padding:10px 13px}
.albumChip.active{background:linear-gradient(180deg,#a75bff,#6620ed);color:#fff;box-shadow:0 0 14px #873cff88}
.photoWrap{position:relative}
.photoWrap.selected img{outline:4px solid #a75bff;filter:brightness(.7)}
.selBadge{position:absolute;top:6px;right:6px;background:#a75bff;color:white;border-radius:999px;width:25px;height:25px;display:grid;place-items:center;font-weight:900}
.multiActions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.multiActions button{border:0;border-radius:15px;padding:13px;color:white;background:#171126;border:1px solid #5a2799}


.modalBack{position:fixed;inset:0;background:#000b;z-index:80;display:grid;place-items:center;padding:22px}
.modalCard{width:100%;max-width:390px;background:#11101c;border:1px solid #8b3cff;border-radius:22px;padding:18px;box-shadow:0 0 30px #873cff88}
.modalCard h2{margin:0 0 12px}
.modalGrid{display:grid;gap:10px}
.modalGrid button{border:1px solid #5a2799;background:#171126;color:white;border-radius:16px;padding:14px;text-align:left}
.modalGrid button.active{background:linear-gradient(180deg,#a75bff,#6620ed)}
.viewerImgWrap img{transform-origin:0 0}

</style>
</head>
<body>
<div id="app" class="phone"></div>
<div id="viewer" class="hidden"></div>
<script>
const ghostSVG='data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f0d8ff"/><stop offset="1" stop-color="#6525ff"/></linearGradient></defs><path d="M50 165V82c0-39 23-62 50-62s50 23 50 62v83c-10 0-15-12-25-12s-15 16-25 16-15-16-25-16-15 12-25 12z" fill="url(#g)"/><ellipse cx="80" cy="84" rx="12" ry="20" fill="#080514"/><ellipse cx="120" cy="84" rx="12" ry="20" fill="#080514"/><ellipse cx="100" cy="121" rx="8" ry="6" fill="#080514"/></svg>`);
const app=document.querySelector('#app'), viewer=document.querySelector('#viewer');
let state=JSON.parse(localStorage.ghostStateV03||'{}');
state.setupDone=state.setupDone||false;
state.disguise=state.disguise||'calculator';
state.unlock=state.unlock||{calculator:'7777=',weather:['sun','cloud','rain'],calendar:['28'],notes:'ghostmode',files:'Invoices 2026'};
state.notes=state.notes||[]; state.files=state.files||[]; state.contacts=state.contacts||[]; state.photos=state.photos||[]; state.albums=state.albums||['Default']; state.activeAlbum=state.activeAlbum||'Default'; let selectedPhotos=[]; let selectMode=false;
let current=''; let calcVal=''; let weatherSeq=[]; let calendarSeq=[]; let currentPhoto=0; let imgScale=1; let panX=0; let panY=0;
function save(){localStorage.ghostStateV03=JSON.stringify(state)}
function flash(t){
  let el=document.querySelector('#flashMsg');
  if(!el){
    el=document.createElement('div');
    el.id='flashMsg';
    el.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#171126;border:1px solid #8b3cff;color:#fff;border-radius:14px;padding:12px 18px;box-shadow:0 0 18px #873cff;z-index:999;font-weight:800;text-align:center';
    document.body.appendChild(el);
  }
  el.textContent=t;
  setTimeout(()=>{if(el)el.remove()},1500);
}
function shell(inner){app.innerHTML=`<div class="screen"><div class="status"><span>9:41</span><span class="icons">▮▮▮ ᯤ ▭</span></div>${inner}</div>`}
function ghost(cls=''){return `<img class="ghost ${cls}" src="${ghostSVG}">`}
function hideNow(){viewer.classList.add('hidden'); calcVal=''; weatherSeq=[]; calendarSeq=[]; current='disguise'; disguiseApp()}
function resetApp(){if(confirm('Reset Ghost setup?')){localStorage.removeItem('ghostStateV03');location.reload()}}
function welcome(){current='welcome';shell(`${ghost()}<h1 class="title">Welcome to<br><span class="grad">GHOST</span></h1><p class="sub">Create your private vault, then Ghost will only open as your chosen disguise.</p><div class="card"><p>First launch only:</p><p>1. Choose disguise</p><p>2. Set secret unlock</p><p>3. Create vault</p></div><button class="btn" onclick="chooseDisguise()">Get Started →</button>`)}
function chooseDisguise(){current='setup';const opts=[['calculator','🧮','Calculator','Unlock with a secret calculation'],['weather','🌤️','Weather','Unlock with a secret weather sequence'],['calendar','📅','Calendar','Unlock with a secret date'],['notes','🗒️','Notes','Unlock with a hidden word'],['files','📁','Files','Unlock with a secret folder']];shell(`<div class="topbar"><button class="back" onclick="welcome()">←</button></div>${ghost('small')}<h1 class="title">Choose your<br><span class="grad">disguise</span></h1><p class="sub">This becomes the front page after setup.</p>${opts.map(o=>`<div class="option ${state.disguise==o[0]?'selected':''}" onclick="state.disguise='${o[0]}';save();chooseDisguise()"><div class="miniIcon">${o[1]}</div><div><h3>${o[2]}</h3><p>${o[3]}</p></div><div class="radio"></div></div>`).join('')}<button class="btn" onclick="unlockSetup()">Continue →</button>`)}
function unlockSetup(){current='setup';let d=state.disguise;let content='';if(d==='calculator')content=`<h1 class="title">Calculator<br><span class="grad">unlock</span></h1><p class="sub">Example: 7777= or 1234+</p><input id="unlockInput" class="input" value="${state.unlock.calculator}" placeholder="Secret calculator code">`;if(d==='weather')content=`<h1 class="title">Weather<br><span class="grad">sequence</span></h1><p class="sub">Type a sequence using sun, cloud, rain, storm.</p><input id="unlockInput" class="input" value="${state.unlock.weather.join(',')}" placeholder="sun,cloud,rain">`;if(d==='calendar')content=`<h1 class="title">Calendar<br><span class="grad">date</span></h1><p class="sub">Choose one date or sequence.</p><input id="unlockInput" class="input" value="${state.unlock.calendar.join(',')}" placeholder="28 or 7,14,21">`;if(d==='notes')content=`<h1 class="title">Notes<br><span class="grad">secret word</span></h1><p class="sub">Typing this word in the decoy notes unlocks Ghost.</p><input id="unlockInput" class="input" value="${state.unlock.notes}" placeholder="ghostmode">`;if(d==='files')content=`<h1 class="title">Files<br><span class="grad">secret folder</span></h1><p class="sub">Opening this fake folder unlocks Ghost.</p><input id="unlockInput" class="input" value="${state.unlock.files}" placeholder="Invoices 2026">`;shell(`<div class="topbar"><button class="back" onclick="chooseDisguise()">←</button></div>${ghost('small')}${content}<button class="btn" onclick="saveUnlock()">Create Vault →</button>`)}
function saveUnlock(){let v=document.querySelector('#unlockInput').value.trim();if(!v)return alert('Add an unlock method');let d=state.disguise;if(d==='calculator')state.unlock.calculator=v;if(d==='weather')state.unlock.weather=v.split(',').map(x=>x.trim().toLowerCase()).filter(Boolean);if(d==='calendar')state.unlock.calendar=v.split(',').map(x=>x.trim()).filter(Boolean);if(d==='notes')state.unlock.notes=v;if(d==='files')state.unlock.files=v;state.setupDone=true;save();created()}
function created(){current='created';shell(`${ghost()}<h1 class="title">Vault<br><span class="grad">created</span></h1><p class="sub">From now on, Ghost opens as your disguise.</p><div class="card"><p>Disguise: <b>${state.disguise}</b></p><p>Status: <b style="color:#8dffb1">Hidden</b></p></div><button class="btn" onclick="hideNow()">Open Disguise →</button>`)}
function disguiseApp(){current='disguise'; if(state.disguise==='weather')return weatherApp(); if(state.disguise==='calendar')return calendarApp(); if(state.disguise==='notes')return notesDecoy(); if(state.disguise==='files')return filesDecoy(); return calcApp()}
function calcApp(){calcVal='';shell(`<div class="fakeTitle">Calculator</div><div class="calcDisplay" id="display">0</div><div class="calcGrid">${['C','÷','×','⌫','7','8','9','-','4','5','6','+','1','2','3','=','0','.','%','GO'].map(x=>`<button class="${'+-×÷='.includes(x)||x=='GO'?'op':''} ${x=='='?'eq':''}" onclick="calcPress('${x}')">${x}</button>`).join('')}</div><p class="privacyNote">Standard calculator</p>`)}
function calcPress(x){if(x==='C')calcVal='';else if(x==='⌫')calcVal=calcVal.slice(0,-1);else if(x==='GO'||x==='='){if(calcVal+x===state.unlock.calculator||calcVal===state.unlock.calculator.replace('=',''))return vault();try{calcVal=String(Function('return '+calcVal.replaceAll('×','*').replaceAll('÷','/').replace('%','/100'))())}catch(e){calcVal='Error'}}else calcVal+=x;document.querySelector('#display').textContent=calcVal||'0'}
function weatherApp(){weatherSeq=[];shell(`<div class="fakeTitle">Weather</div><div class="card" style="text-align:center"><div style="font-size:72px">🌤️</div><h1>18°C</h1><p>Partly cloudy</p></div><div class="weatherCards">${[['sun','☀️','Sun'],['cloud','☁️','Cloud'],['rain','🌧️','Rain'],['storm','⛈️','Storm']].map(w=>`<div class="wCard" onclick="weatherTap('${w[0]}')">${w[1]}<br>${w[2]}</div>`).join('')}</div>`)}
function weatherTap(w){weatherSeq.push(w);let target=state.unlock.weather.join(',');if(weatherSeq.slice(-state.unlock.weather.length).join(',')===target)vault()}
function calendarApp(){calendarSeq=[];let d=new Date(),days=Array.from({length:31},(_,i)=>i+1);shell(`<div class="fakeTitle">Calendar</div><h2 style="text-align:center">${d.toLocaleString('default',{month:'long'})} ${d.getFullYear()}</h2><div class="calendarGrid">${days.map(day=>`<button class="day" onclick="calendarTap('${day}')">${day}</button>`).join('')}</div>`)}
function calendarTap(day){calendarSeq.push(day);let target=state.unlock.calendar.join(',');if(calendarSeq.slice(-state.unlock.calendar.length).join(',')===target)vault()}
function notesDecoy(){shell(`<div class="fakeTitle">Notes</div><textarea id="dnote" class="noteArea" placeholder="Start typing..."></textarea><button class="btn" onclick="checkNote()">Save</button>`)}
function checkNote(){let v=document.querySelector('#dnote').value;if(v.includes(state.unlock.notes))vault();else alert('Note saved')}
function filesDecoy(){let folders=['Downloads','Pictures','Documents','Music','Invoices 2026','Receipts'];shell(`<div class="fakeTitle">Files</div><div class="fileList">${folders.map(f=>`<button onclick="fileOpen('${f}')">📁 ${f}</button>`).join('')}</div>`)}
function fileOpen(f){if(f===state.unlock.files)vault();else alert('Folder opened')}
function vault(){current='vault';shell(`<div class="appHead"><img src="${ghostSVG}"><h2>Ghost Vault</h2><button class="back spacer" onclick="hideNow()">×</button></div><div class="grid"><div class="vaultBtn" onclick="photos()"><div class="big">▧</div>Photos</div><div class="vaultBtn" onclick="filesVault()"><div class="big">▤</div>Files</div><div class="vaultBtn" onclick="browserVault()"><div class="big">◎</div>Browser</div><div class="vaultBtn" onclick="notesVault()"><div class="big">☷</div>Notes</div><div class="vaultBtn" onclick="contactsVault()"><div class="big">♙</div>Contacts</div><div class="vaultBtn" onclick="settings()"><div class="big">⚙️</div>Settings</div></div>${nav()}`)}
function nav(){return `<div class="nav"><button onclick="vault()"><span class="nI">⌂</span>Home</button><button onclick="browserVault()"><span class="nI">◎</span>Browser</button><button onclick="photos()"><span class="nI">▧</span>Photos</button><button onclick="notesVault()"><span class="nI">☷</span>Notes</button><button onclick="hideNow()"><span class="nI">◌</span>Hide</button></div>`}
function photos(){
current='photos';
selectedPhotos=[];
selectMode=false;
drawPhotos();
}
function albumChips(){
  return `<div class="albumBar">${state.albums.map(a=>`<button class="albumChip ${state.activeAlbum===a?'active':''}" onclick="state.activeAlbum='${a}';save();drawPhotos()">${a}</button>`).join('')}<button class="albumChip" onclick="createAlbum()">＋ Album</button><button class="albumChip" onclick="deleteAlbum()">Delete Album</button></div>`;
}
function filteredPhotoIndexes(){
  return state.photos.map((p,i)=>({p,i})).filter(x=>(x.p.album||'Default')===state.activeAlbum).map(x=>x.i);
}
function drawPhotos(){
  const idxs=filteredPhotoIndexes();
  shell(`<div class="appHead"><button class="back" onclick="vault()">←</button><h2>Private Photos</h2></div>
  ${albumChips()}
  <input type="file" accept="image/*" multiple onchange="addPhotos(this.files)" class="input">
  <p class="privacyNote">Uploads go into: <b>${state.activeAlbum}</b></p>
  <div class="multiActions">
    <button onclick="toggleSelectMode()">${selectMode?'Cancel Select':'Select Multiple'}</button>
    <button onclick="createAlbum()">Create Album</button>
  </div>
  ${selectMode?`<div class="multiActions"><button onclick="moveSelectedPhotos()">Move Selected</button><button onclick="deleteSelectedPhotos()">Delete Selected</button></div><p class="privacyNote">${selectedPhotos.length} selected</p>`:''}
  <div class="picGrid" style="margin-top:18px">${idxs.map(i=>{
    const p=state.photos[i];
    const selected=selectedPhotos.includes(i);
    return `<div class="photoWrap ${selected?'selected':''}" onclick="${selectMode?`togglePhotoSelect(${i})`:`openViewerByAlbumIndex(${idxs.indexOf(i)})`}"><img src="${p.src||p}">${selected?'<div class="selBadge">✓</div>':''}</div>`;
  }).join('')||'<p class="sub">No photos in this album yet.</p>'}</div>${nav()}`);
}
function createAlbum(){
  const name=prompt('Album name?');
  if(!name)return;
  if(!state.albums.includes(name))state.albums.push(name);
  state.activeAlbum=name;
  save();
  drawPhotos();
}
function deleteAlbum(){
  const album=state.activeAlbum;
  if(album==='Default')return alert('Default album cannot be deleted');
  showAlbumDeleteOptions(album);
}
function showAlbumDeleteOptions(album){
  const modal=document.createElement('div');
  modal.className='modalBack';
  modal.innerHTML=`<div class="modalCard"><h2>Delete ${album}?</h2><p class="privacyNote">Choose what happens to photos inside this album.</p><div class="modalGrid"><button onclick="confirmDeleteAlbum('${album}','delete')">Delete album and everything inside</button><button onclick="confirmDeleteAlbum('${album}','default')">Delete album and move photos to Default</button><button onclick="closeModal()">Cancel</button></div></div>`;
  document.body.appendChild(modal);
}
function confirmDeleteAlbum(album,mode){
  if(mode==='delete'){
    if(!confirm('Delete album and all photos inside?'))return;
    state.photos=state.photos.filter(p=>getPhotoAlbum(p)!==album);
  }else{
    state.photos.forEach((p,i)=>{
      if(getPhotoAlbum(p)===album){
        if(typeof p==='string')state.photos[i]={src:p,album:'Default'};
        else p.album='Default';
      }
    });
  }
  state.albums=state.albums.filter(a=>a!==album);
  state.activeAlbum='Default';
  save();
  closeModal();
  drawPhotos();
}
function closeModal(){document.querySelectorAll('.modalBack').forEach(m=>m.remove())}
function toggleSelectMode(){selectMode=!selectMode;selectedPhotos=[];drawPhotos()}
function togglePhotoSelect(i){
  if(selectedPhotos.includes(i))selectedPhotos=selectedPhotos.filter(x=>x!==i);
  else selectedPhotos.push(i);
  drawPhotos();
}
function deleteSelectedPhotos(){
  if(!selectedPhotos.length)return alert('Select photos first');
  if(!confirm('Delete selected photos?'))return;
  state.photos=state.photos.filter((_,i)=>!selectedPhotos.includes(i));
  selectedPhotos=[];
  save();
  drawPhotos();
}
function moveSelectedPhotos(){
  if(!selectedPhotos.length)return alert('Select photos first');
  showAlbumPicker('selected');
}
function showAlbumPicker(mode){
  const modal=document.createElement('div');
  modal.className='modalBack';
  modal.innerHTML=`<div class="modalCard"><h2>Move to album</h2><div class="modalGrid">${state.albums.map(a=>`<button class="${a===state.activeAlbum?'active':''}" onclick="finishAlbumMove('${mode}','${a}')">${a}</button>`).join('')}<button onclick="createAlbumFromPicker('${mode}')">＋ Create New Album</button><button onclick="closeModal()">Cancel</button></div></div>`;
  document.body.appendChild(modal);
}
function createAlbumFromPicker(mode){
  const name=prompt('New album name?');
  if(!name)return;
  if(!state.albums.includes(name))state.albums.push(name);
  finishAlbumMove(mode,name);
}
function finishAlbumMove(mode,album){
  if(mode==='selected'){
    selectedPhotos.forEach(i=>{
      if(typeof state.photos[i]==='string')state.photos[i]={src:state.photos[i],album};
      else state.photos[i].album=album;
    });
    selectedPhotos=[];
  }else{
    if(typeof state.photos[currentPhoto]==='string')state.photos[currentPhoto]={src:state.photos[currentPhoto],album};
    else state.photos[currentPhoto].album=album;
  }
  state.activeAlbum=album;
  save();
  closeModal();
  if(mode==='selected')drawPhotos();else drawViewer();
}
function addPhotos(files){
  const selected=Array.from(files||[]);
  if(!selected.length){flash('No photos selected');return;}
  flash('Uploading '+selected.length+' photo'+(selected.length>1?'s':'')+'...');
  let loaded=[];
  let done=0;
  selected.forEach(file=>{
    const reader=new FileReader();
    reader.onload=function(e){
      if(e.target&&e.target.result)loaded.push({src:e.target.result,album:state.activeAlbum||'Default'});
      done++;
      if(done===selected.length){
        state.photos=state.photos||[];
        state.photos=state.photos.concat(loaded);
        save();
        flash(loaded.length+' photo'+(loaded.length!==1?'s':'')+' added');
        drawPhotos();
      }
    };
    reader.onerror=function(){
      done++;
      if(done===selected.length){
        state.photos=state.photos.concat(loaded);
        save();
        flash(loaded.length+' photo'+(loaded.length!==1?'s':'')+' added');
        drawPhotos();
      }
    };
    reader.readAsDataURL(file);
  });
}
function openViewerByAlbumIndex(albumIndex){
  const idxs=filteredPhotoIndexes();
  currentPhoto=idxs[albumIndex]||0;
  imgScale=1;
  drawViewer();
}
function openViewer(i){currentPhoto=i;imgScale=1;drawViewer()}
function getPhotoSrc(p){return typeof p==='string'?p:p.src}
function getPhotoAlbum(p){return typeof p==='string'?'Default':(p.album||'Default')}
function drawViewer(){
let p=state.photos[currentPhoto];let src=getPhotoSrc(p);let album=getPhotoAlbum(p);let idxs=filteredPhotoIndexes();let countPos=idxs.indexOf(currentPhoto)+1;if(countPos<1)countPos=currentPhoto+1;panX=0;panY=0;imgScale=1;
viewer.className='viewer';
viewer.innerHTML=`<div class="viewerTop"><button onclick="closeViewer()">Close</button><div style="flex:1;text-align:center">${countPos} / ${idxs.length||state.photos.length}<br><small>${album}</small></div><button onclick="hideNow()">Hide</button></div><div class="viewerImgWrap" id="viewerWrap"><img id="viewerImg" src="${src}"></div><div class="viewerActions"><button onclick="prevPhoto()">← Previous</button><button onclick="nextPhoto()">Next →</button><button onclick="zoomPhoto()">Zoom</button><button onclick="moveCurrentPhoto()">Move Album</button><button class="release" onclick="releasePhoto()">Release</button><button class="danger" onclick="deletePhoto()">Delete</button></div>`;
applyImageTransform();
let startX=0,startY=0,lastX=0,lastY=0,startDist=0,startScale=1,startPanX=0,startPanY=0,midX=0,midY=0;
viewer.ontouchstart=e=>{
  if(e.touches.length===1){
    startX=e.touches[0].clientX;startY=e.touches[0].clientY;lastX=startX;lastY=startY;startPanX=panX;startPanY=panY;
  }
  if(e.touches.length===2){
    let a=e.touches[0],b=e.touches[1];
    let dx=a.clientX-b.clientX,dy=a.clientY-b.clientY;
    startDist=Math.sqrt(dx*dx+dy*dy);
    startScale=imgScale;startPanX=panX;startPanY=panY;
    midX=(a.clientX+b.clientX)/2;midY=(a.clientY+b.clientY)/2;
  }
};
viewer.ontouchmove=e=>{
  e.preventDefault();
  if(e.touches.length===1&&imgScale>1){
    let t=e.touches[0];
    panX=startPanX+(t.clientX-startX);
    panY=startPanY+(t.clientY-startY);
    applyImageTransform();
  }
  if(e.touches.length===2&&startDist){
    let a=e.touches[0],b=e.touches[1];
    let dx=a.clientX-b.clientX,dy=a.clientY-b.clientY;
    let dist=Math.sqrt(dx*dx+dy*dy);
    let newScale=Math.max(1,Math.min(4,startScale*(dist/startDist)));
    let newMidX=(a.clientX+b.clientX)/2,newMidY=(a.clientY+b.clientY)/2;
    panX=startPanX+(newMidX-midX);
    panY=startPanY+(newMidY-midY);
    imgScale=newScale;
    applyImageTransform();
  }
};
viewer.ontouchend=e=>{
  if(imgScale<=1&&e.changedTouches&&e.changedTouches.length){
    let dx=e.changedTouches[0].clientX-startX;
    if(dx>60)prevPhoto();
    if(dx<-60)nextPhoto();
  }
};
}
function applyImageTransform(){
  const img=document.querySelector('#viewerImg');
  if(!img)return;
  img.style.transform=`translate(${panX}px,${panY}px) scale(${imgScale})`;
}
function closeViewer(){viewer.className='hidden';drawPhotos()}function prevPhoto(){const idxs=filteredPhotoIndexes();if(idxs.length){let pos=idxs.indexOf(currentPhoto);currentPhoto=idxs[(pos-1+idxs.length)%idxs.length];drawViewer()}}function nextPhoto(){const idxs=filteredPhotoIndexes();if(idxs.length){let pos=idxs.indexOf(currentPhoto);currentPhoto=idxs[(pos+1)%idxs.length];drawViewer()}}function zoomPhoto(){imgScale=imgScale>=2.5?1:imgScale+.5;panX=0;panY=0;applyImageTransform()}function moveCurrentPhoto(){showAlbumPicker('current')}function deletePhoto(){if(confirm('Delete this photo?')){state.photos.splice(currentPhoto,1);save();if(!state.photos.length){viewer.className='hidden';drawPhotos()}else{currentPhoto=Math.min(currentPhoto,state.photos.length-1);drawViewer()}}}function releasePhoto(){if(confirm('Release this photo from Ghost vault? This removes it from Ghost only.'))deletePhoto()}
function filesVault(){current='filesVault';shell(`<div class="appHead"><button class="back" onclick="vault()">←</button><h2>Private Files</h2></div><input type="file" multiple onchange="addFiles(this.files)" class="input"><div class="fileList">${state.files.map(f=>`<button>📄 ${f.name}<span style="margin-left:auto;color:#aaa">${Math.round(f.size/1024)}kb</span></button>`).join('')||'<p class="sub">No files yet.</p>'}</div>${nav()}`)}
function addFiles(files){[...files].forEach(f=>state.files.push({name:f.name,size:f.size,type:f.type}));save();filesVault()}
function notesVault(){current='notesVault';shell(`<div class="appHead"><button class="back" onclick="vault()">←</button><h2>Private Notes</h2></div><textarea id="newNote" class="noteArea" placeholder="Write a private note..."></textarea><button class="btn" onclick="state.notes.unshift(document.querySelector('#newNote').value);save();notesVault()">Save Note</button>${state.notes.map((n,i)=>`<div class="card" style="margin-top:12px">${n}<button class="btn danger" onclick="state.notes.splice(${i},1);save();notesVault()">Delete</button></div>`).join('')}${nav()}`)}
function contactsVault(){current='contacts';shell(`<div class="appHead"><button class="back" onclick="vault()">←</button><h2>Ghost Contacts</h2></div><input id="cName" class="input" placeholder="Name"><input id="cNum" class="input" style="margin-top:10px" placeholder="Number"><button class="btn" onclick="addContact()">Save Contact</button><h3 style="margin-top:18px">Saved Contacts</h3><div class="contactList">${state.contacts.map((c,i)=>`<button onclick="if(confirm('Delete contact?')){state.contacts.splice(${i},1);save();contactsVault()}">👤 ${c.name}<span style="margin-left:auto;color:#aaa">${c.num}</span></button>`).join('')||'<p class="sub">No contacts saved yet.</p>'}</div><p class="privacyNote">This web version stores contacts inside Ghost only.</p>${nav()}`)}
function addContact(){
  const nameEl=document.querySelector('#cName');
  const numEl=document.querySelector('#cNum');
  const name=(nameEl.value||'').trim();
  const num=(numEl.value||'').trim();
  if(!name || !num){alert('Add name and number');return;}
  state.contacts = state.contacts || [];
  state.contacts.push({name:name,num:num});
  save();
  flash('Contact added');
  contactsVault();
}
function browserVault(){current='browser';let hist=JSON.parse(localStorage.ghostBrowserHistoryV03||'[]');shell(`<div class="appHead"><button class="back" onclick="vault()">←</button><h2>Ghost Browser</h2></div><div class="browserBar"><input id="url" placeholder="Search Google or type URL"><button onclick="searchWeb()" class="btn" style="width:auto;margin:0;padding:12px 16px;border-radius:16px">Go</button></div><div class="webFrame"><div class="google">Google</div><div class="searchPill">Search opens in Chrome in this web version</div><h3>Ghost search history</h3>${hist.map(h=>`<p>↗ ${h}</p>`).join('')||'<p class="hint">No Ghost browser history yet.</p>'}</div><button class="btn danger" onclick="burnBrowser()">Burn Ghost Browser History</button><p class="privacyNote">Important: this cannot delete Chrome, Google account, phone provider, or other app history.</p>${nav()}`)}
function searchWeb(){let q=document.querySelector('#url').value.trim();if(!q)return;let hist=JSON.parse(localStorage.ghostBrowserHistoryV03||'[]');hist.unshift(q);localStorage.ghostBrowserHistoryV03=JSON.stringify(hist.slice(0,20));window.open('https://www.google.com/search?q='+encodeURIComponent(q),'_blank')}
function burnBrowser(){if(confirm('Delete Ghost browser history only?')){localStorage.removeItem('ghostBrowserHistoryV03');browserVault()}}
function settings(){current='settings';shell(`<div class="appHead"><button class="back" onclick="vault()">←</button><h2>Settings</h2></div><div class="card"><p>Disguise: <b>${state.disguise}</b></p><p>Emergency hide: <b style="color:#8dffb1">On</b></p></div><button class="btn dark" onclick="chooseDisguise()">Change Disguise</button><button class="btn dark" onclick="unlockSetup()">Change Unlock</button><button class="btn danger" onclick="resetApp()">Reset Setup</button>${nav()}`)}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&current!=='disguise'&&current!=='photos'){setTimeout(()=>hideNow(),100)}});
window.addEventListener('pagehide',()=>{if(current!=='disguise')hideNow()});
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
if(state.setupDone)disguiseApp();else welcome();
</script>
</body>
</html>
