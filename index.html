<body>
<div id="app" class="phone"></div>
<div id="viewer" class="hidden"></div>
<script>
const ghostSVG='data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f0d8ff"/><stop offset="1" stop-color="#6525ff"/></linearGradient></defs><path d="M50 165V82c0-39 23-62 50-62s50 23 50 62v83c-10 0-15-12-25-12s-15 16-25 16-15-16-25-16-15 12-25 12z" fill="url(#g)"/><ellipse cx="80" cy="84" rx="12" ry="20" fill="#080514"/><ellipse cx="120" cy="84" rx="12" ry="20" fill="#080514"/><ellipse cx="100" cy="121" rx="8" ry="6" fill="#080514"/></svg>`);
const app=document.querySelector('#app'), viewer=document.querySelector('#viewer');
let state=JSON.parse(localStorage.ghostStateV03||'{}');
state.setupDone=state.setupDone||false;
state.disguise=state.disguise||'calculator';
state.unlock=state.unlock||{calculator:'7777=',weather:['sun','cloud','rain'],calendar:['28'],notes:'ghostmode',files:'Invoices 2026'};
state.notes=state.notes||[]; state.files=state.files||[]; state.contacts=state.contacts||[]; state.photos=state.photos||[]; state.albums=state.albums||['Default','Family','Private','Work','Documents']; state.activeAlbum=state.activeAlbum||'Library'; state.albumCovers=state.albumCovers||{}; let selectedPhotos=[]; let selectMode=false; let isPickingPhotos=false;
let current=''; let calcVal=''; let weatherSeq=[]; let calendarSeq=[]; let currentPhoto=0; let imgScale=1; let panX=0; let panY=0;
function save(){localStorage.ghostStateV03=JSON.stringify(state)}
function flash(t){
  let el=document.querySelector('#flashMsg');
  if(!el){
    el=document.createElement('div');
    el.id='flashMsg';
    el.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#171126;border:1px solid #8b3cff;color:#fff;border-radius:14px;padding:12px 18px;box-shadow:0 0 18px #873cff;z-index:999;font-weight:800;text-align:center';
    document.body.appendChild(el);
  }
  el.textContent=t;
  setTimeout(()=>{if(el)el.remove()},1500);
}
function shell(inner){app.innerHTML=`<div class="screen"><div class="status"><span>9:41</span><span class="icons">▮▮▮ ᯤ ▭</span></div>${inner}</div>`}
function ghost(cls=''){return `<img class="ghost ${cls}" src="${ghostSVG}">`}
function hideNow(){viewer.classList.add('hidden'); calcVal=''; weatherSeq=[]; calendarSeq=[]; current='disguise'; disguiseApp()}
function resetApp(){if(confirm('Reset Ghost setup?')){localStorage.removeItem('ghostStateV03');location.reload()}}
function welcome(){current='welcome';shell(`${ghost()}<h1 class="title">Welcome to<br><span class="grad">GHOST</span></h1><p class="sub">Create your private vault, then Ghost will only open as your chosen disguise.</p><div class="card"><p>First launch only:</p><p>1. Choose disguise</p><p>2. Set secret unlock</p><p>3. Create vault</p></div><button class="btn" onclick="chooseDisguise()">Get Started →</button>`)}
function chooseDisguise(){current='setup';const opts=[['calculator','🧮','Calculator','Unlock with a secret calculation'],['weather','🌤️','Weather','Unlock with a secret weather sequence'],['calendar','📅','Calendar','Unlock with a secret date'],['notes','🗒️','Notes','Unlock with a hidden word'],['files','📁','Files','Unlock with a secret folder']];shell(`<div class="topbar"><button class="back" onclick="welcome()">←</button></div>${ghost('small')}<h1 class="title">Choose your<br><span class="grad">disguise</span></h1><p class="sub">This becomes the front page after setup.</p>${opts.map(o=>`<div class="option ${state.disguise==o[0]?'selected':''}" onclick="state.disguise='${o[0]}';save();chooseDisguise()"><div class="miniIcon">${o[1]}</div><div><h3>${o[2]}</h3><p>${o[3]}</p></div><div class="radio"></div></div>`).join('')}<button class="btn" onclick="unlockSetup()">Continue →</button>`)}
function unlockSetup(){current='setup';let d=state.disguise;let content='';if(d==='calculator')content=`<h1 class="title">Calculator<br><span class="grad">unlock</span></h1><p class="sub">Example: 7777= or 1234+</p><input id="unlockInput" class="input" value="${state.unlock.calculator}" placeholder="Secret calculator code">`;if(d==='weather')content=`<h1 class="title">Weather<br><span class="grad">sequence</span></h1><p class="sub">Type a sequence using sun, cloud, rain, storm.</p><input id="unlockInput" class="input" value="${state.unlock.weather.join(',')}" placeholder="sun,cloud,rain">`;if(d==='calendar')content=`<h1 class="title">Calendar<br><span class="grad">date</span></h1><p class="sub">Choose one date or sequence.</p><input id="unlockInput" class="input" value="${state.unlock.calendar.join(',')}" placeholder="28 or 7,14,21">`;if(d==='notes')content=`<h1 class="title">Notes<br><span class="grad">secret word</span></h1><p class="sub">Typing this word in the decoy notes unlocks Ghost.</p><input id="unlockInput" class="input" value="${state.unlock.notes}" placeholder="ghostmode">`;if(d==='files')content=`<h1 class="title">Files<br><span class="grad">secret folder</span></h1><p class="sub">Opening this fake folder unlocks Ghost.</p><input id="unlockInput" class="input" value="${state.unlock.files}" placeholder="Invoices 2026">`;shell(`<div class="topbar"><button class="back" onclick="chooseDisguise()">←</button></div>${ghost('small')}${content}<button class="btn" onclick="saveUnlock()">Create Vault →</button>`)}
function saveUnlock(){let v=document.querySelector('#unlockInput').value.trim();if(!v)return alert('Add an unlock method');let d=state.disguise;if(d==='calculator')state.unlock.calculator=v;if(d==='weather')state.unlock.weather=v.split(',').map(x=>x.trim().toLowerCase()).filter(Boolean);if(d==='calendar')state.unlock.calendar=v.split(',').map(x=>x.trim()).filter(Boolean);if(d==='notes')state.unlock.notes=v;if(d==='files')state.unlock.files=v;state.setupDone=true;save();created()}
function created(){current='created';shell(`${ghost()}<h1 class="title">Vault<br><span class="grad">created</span></h1><p class="sub">From now on, Ghost opens as your disguise.</p><div class="card"><p>Disguise: <b>${state.disguise}</b></p><p>Status: <b style="color:#8dffb1">Hidden</b></p></div><button class="btn" onclick="hideNow()">Open Disguise →</button>`)}
function disguiseApp(){current='disguise'; if(state.disguise==='weather')return weatherApp(); if(state.disguise==='calendar')return calendarApp(); if(state.disguise==='notes')return notesDecoy(); if(state.disguise==='files')return filesDecoy(); return calcApp()}
function calcApp(){calcVal='';shell(`<div class="fakeTitle">Calculator</div><div class="calcDisplay" id="display">0</div><div class="calcGrid">${['C','÷','×','⌫','7','8','9','-','4','5','6','+','1','2','3','=','0','.','%','GO'].map(x=>`<button class="${'+-×÷='.includes(x)||x=='GO'?'op':''} ${x=='='?'eq':''}" onclick="calcPress('${x}')">${x}</button>`).join('')}</div><p class="privacyNote">Standard calculator</p>`)}
function calcPress(x){if(x==='C')calcVal='';else if(x==='⌫')calcVal=calcVal.slice(0,-1);else if(x==='GO'||x==='='){if(calcVal+x===state.unlock.calculator||calcVal===state.unlock.calculator.replace('=',''))return vault();try{calcVal=String(Function('return '+calcVal.replaceAll('×','*').replaceAll('÷','/').replace('%','/100'))())}catch(e){calcVal='Error'}}else calcVal+=x;document.querySelector('#display').textContent=calcVal||'0'}
function weatherApp(){weatherSeq=[];shell(`<div class="fakeTitle">Weather</div><div class="card" style="text-align:center"><div style="font-size:72px">🌤️</div><h1>18°C</h1><p>Partly cloudy</p></div><div class="weatherCards">${[['sun','☀️','Sun'],['cloud','☁️','Cloud'],['rain','🌧️','Rain'],['storm','⛈️','Storm']].map(w=>`<div class="wCard" onclick="weatherTap('${w[0]}')">${w[1]}<br>${w[2]}</div>`).join('')}</div>`)}
function weatherTap(w){weatherSeq.push(w);let target=state.unlock.weather.join(',');if(weatherSeq.slice(-state.unlock.weather.length).join(',')===target)vault()}
function calendarApp(){calendarSeq=[];let d=new Date(),days=Array.from({length:31},(_,i)=>i+1);shell(`<div class="fakeTitle">Calendar</div><h2 style="text-align:center">${d.toLocaleString('default',{month:'long'})} ${d.getFullYear()}</h2><div class="calendarGrid">${days.map(day=>`<button class="day" onclick="calendarTap('${day}')">${day}</button>`).join('')}</div>`)}
function calendarTap(day){calendarSeq.push(day);let target=state.unlock.calendar.join(',');if(calendarSeq.slice(-state.unlock.calendar.length).join(',')===target)vault()}
function notesDecoy(){shell(`<div class="fakeTitle">Notes</div><textarea id="dnote" class="noteArea" placeholder="Start typing..."></textarea><button class="btn" onclick="checkNote()">Save</button>`)}
function checkNote(){let v=document.querySelector('#dnote').value;if(v.includes(state.unlock.notes))vault();else alert('Note saved')}
function filesDecoy(){let folders=['Downloads','Pictures','Documents','Music','Invoices 2026','Receipts'];shell(`<div class="fakeTitle">Files</div><div class="fileList">${folders.map(f=>`<button onclick="fileOpen('${f}')">📁 ${f}</button>`).join('')}</div>`)}
function fileOpen(f){if(f===state.unlock.files)vault();else alert('Folder opened')}
function vault(){current='vault';shell(`<div class="vaultPage"><img class="vaultMiniLogo" src="ghost-main-logo.png" alt="Ghost"><button class="vaultClose" onclick="hideNow()">×</button><div class="vaultHero"><img class="vaultHeroLogo" src="ghost-hero-moon.png" alt="Ghost"><div class="vaultBrandTitle">GHOST</div><div class="vaultBrandSub">SECRET VAULT</div></div><div class="vaultDashGrid"><div class="vaultBtn" onclick="photos()"><div class="big"><img src="icon-photos.svg" alt=""></div><span>Photos</span></div><div class="vaultBtn" onclick="filesVault()"><div class="big"><img src="icon-files.svg" alt=""></div><span>Files</span></div><div class="vaultBtn" onclick="browserVault()"><div class="big"><img src="icon-browser.svg" alt=""></div><span>Browser</span></div><div class="vaultBtn" onclick="notesVault()"><div class="big"><img src="icon-notes.svg" alt=""></div><span>Notes</span></div><div class="vaultBtn" onclick="contactsVault()"><div class="big"><img src="icon-contacts.svg" alt=""></div><span>Contacts</span></div><div class="vaultBtn" onclick="settings()"><div class="big"><img src="icon-settings.svg" alt=""></div><span>Settings</span></div></div>${nav()}</div>`)}
function nav(){return `<div class="nav"><button onclick="vault()"><span class="nI"><img src="icon-home.svg" alt=""></span>Home</button><button onclick="browserVault()"><span class="nI"><img src="icon-browser.svg" alt=""></span>Browser</button><button onclick="photos()"><span class="nI"><img src="icon-photos.svg" alt=""></span>Photos</button><button onclick="notesVault()"><span class="nI"><img src="icon-notes.svg" alt=""></span>Notes</button><button onclick="hideNow()"><span class="nI"><img src="icon-hide.svg" alt=""></span>Hide</button></div>`}


function normalizePhotos(){state.photos=(state.photos||[]).map(p=>typeof p==='string'?{src:p,album:'Default',fav:false,created:Date.now()}:Object.assign({album:'Default',fav:false,created:Date.now()},p));if(!state.albums.includes('Default'))state.albums.unshift('Default');state.albumCovers=state.albumCovers||{}}
function photoId(){return 'p_'+Date.now()+'_'+Math.random().toString(36).slice(2)}
function openGhostPhotoDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open('GhostPhotoDBStable',1);req.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains('photos'))db.createObjectStore('photos',{keyPath:'id'})};req.onsuccess=e=>resolve(e.target.result);req.onerror=e=>reject(e)})}
async function dbPutPhoto(id,data){const db=await openGhostPhotoDB();return new Promise((resolve,reject)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').put({id,data});tx.oncomplete=()=>resolve();tx.onerror=e=>reject(e)})}
async function dbGetPhoto(id){const db=await openGhostPhotoDB();return new Promise((resolve,reject)=>{const tx=db.transaction('photos','readonly');const req=tx.objectStore('photos').get(id);req.onsuccess=()=>resolve(req.result?req.result.data:null);req.onerror=e=>reject(e)})}
async function dbDeletePhoto(id){const db=await openGhostPhotoDB();return new Promise((resolve,reject)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').delete(id);tx.oncomplete=()=>resolve();tx.onerror=e=>reject(e)})}
async function ensurePhotoStorage(){state.albums=state.albums||['Default','Family','Private','Work','Documents'];state.albumCovers=state.albumCovers||{};if(!state.albums.includes('Default'))state.albums.unshift('Default');const fixed=[];let changed=false;for(const p of (state.photos||[])){if(typeof p==='string'){const id=photoId();await dbPutPhoto(id,p);fixed.push({id,album:'Default',fav:false,created:Date.now()});changed=true}else if(p&&p.src){const id=p.id||photoId();await dbPutPhoto(id,p.src);fixed.push({id,album:p.album||'Default',fav:!!p.fav,created:p.created||Date.now()});changed=true}else if(p&&p.id){fixed.push(Object.assign({album:'Default',fav:false,created:Date.now()},p))}}state.photos=fixed;if(changed)save()}
async function photos(){current='photos';await ensurePhotoStorage();selectedPhotos=[];selectMode=false;if(!state.activeAlbum)state.activeAlbum='Library';await drawPhotos()}
function albumEmoji(a){return (a==='Library'||a==='All'||a==='All Photos')?'📚':a==='Family'?'👨‍👩‍👧':a==='Private'?'🔒':a==='Work'?'💼':a==='Documents'?'📄':a==='Default'?'🗂️':'📁'}
function albumList(){return ['Library',...state.albums.filter(a=>a!=='Library'&&a!=='All'&&a!=='All Photos')]}
function albumPhotoIndexes(album){if(album==='Library')return state.photos.map((_,i)=>i);return state.photos.map((p,i)=>({p,i})).filter(x=>(x.p.album||'Default')===album).map(x=>x.i)}
function filteredPhotoIndexes(){normalizePhotos();if(state.activeAlbum==='Library'||state.activeAlbum==='All'||state.activeAlbum==='All Photos'||!state.activeAlbum)return state.photos.map((_,i)=>i);return state.photos.map((p,i)=>({p,i})).filter(x=>(x.p.album||'Default')===state.activeAlbum).map(x=>x.i)}
async function photoSrc(i){const p=state.photos[i];if(!p)return '';if(p.src)return p.src;return await dbGetPhoto(p.id)||''}
async function albumCoverSrc(album){const coverId=state.albumCovers&&state.albumCovers[album];if(coverId){const s=await dbGetPhoto(coverId);if(s)return s}const idxs=albumPhotoIndexes(album);if(!idxs.length)return '';return await photoSrc(idxs[idxs.length-1])}
async function drawPhotos(){await ensurePhotoStorage();const active=state.activeAlbum||'Library';if(active==='Library'&&!selectMode){await drawAlbumHome();return}await drawAlbumPhotos(active)}
async function drawAlbumHome(){const albums=albumList();const covers=await Promise.all(albums.map(a=>albumCoverSrc(a)));shell(`<div class="photosShell"><div class="photosTop"><button class="iconBtn" onclick="vault()">←</button><h2>Albums</h2><button class="iconBtn" style="margin-left:auto" onclick="photoSettings()">⚙</button></div><div class="galleryHero"><div class="heroIcon photosPortalIcon"><img src="photos-portal-ghost.png" alt="Ghost Photos"></div><div><h3>Ghost Photos</h3><p>${state.photos.length} photo${state.photos.length===1?'':'s'} stored</p></div><button class="uploadLabel" onclick="createAlbum()">＋ Album</button></div><div class="albumCards">${albums.map((a,n)=>{const count=albumPhotoIndexes(a).length;const cover=covers[n];return `<div class="albumCard" onclick="openAlbum('${a}')" oncontextmenu="event.preventDefault();albumOptions('${a}')"><button class="albumDots" onclick="event.stopPropagation();albumOptions('${a}')">⋮</button><div class="albumCover">${cover?`<img src="${cover}">`:albumEmoji(a)}</div><div class="albumInfo"><h3>${albumEmoji(a)} ${a}</h3><p>${count} photo${count===1?'':'s'}</p></div></div>`}).join('')}</div>${nav()}</div>`)}
function openAlbum(a){state.activeAlbum=a;save();if(a==='Library'||a==='All'||a==='All Photos'){drawAlbumPhotos('Library')}else{drawPhotos()}}
async function drawAlbumPhotos(active){const idxs=filteredPhotoIndexes();const thumbs=await Promise.all(idxs.map(i=>photoSrc(i)));shell(`<div class="photosShell"><div class="photosTop"><button class="iconBtn" onclick="state.activeAlbum='Library';save();drawAlbumHome()">←</button><h2>${active==='Library'?'📚 Library':albumEmoji(active)+' '+active}</h2><button class="iconBtn" style="margin-left:auto" onclick="albumOptions('${active}')">⋮</button></div>${selectMode?`<div class="selectBar"><button onclick="exitSelectMode()">✕</button><strong>${selectedPhotos.length} Selected</strong><button onclick="showAlbumPicker('selected')">📁 Move</button><button class="danger" onclick="deleteSelectedPhotos()">🗑</button></div>`:''}<div class="albumActionRow"><label class="primary" for="photoUploadInput">Upload</label><input id="photoUploadInput" type="file" accept="image/*" multiple onchange="addPhotos(this.files)" onclick="isPickingPhotos=true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0"><button onclick="startAlbumSelect()">Select</button></div><p class="storageNote">Stable storage enabled: photos are stored outside normal settings.</p><div class="photoGridNew">${idxs.map((i,pos)=>{const p=state.photos[i];const selected=selectedPhotos.includes(i);return `<div class="photoTile ${selected?'selected':''}" onclick="${selectMode?`togglePhotoSelect(${i})`:`openViewerByPosition(${pos})`}" oncontextmenu="event.preventDefault();startSelectMode(${i})"><img src="${thumbs[pos]}">${selected?'<div class="photoTick">✓</div>':''}<div class="photoMeta">${p.album||'Default'}</div></div>`}).join('')}</div>${!idxs.length?`<div class="emptyGallery"><div class="bigGhost">👻</div><h3>No photos here yet</h3><p>Tap Upload to add photos to this album.</p></div>`:''}${nav()}</div>`);document.querySelectorAll('.photoTile').forEach((tile,n)=>{let timer=null;tile.addEventListener('touchstart',()=>{timer=setTimeout(()=>{const idx=idxs[n];startSelectMode(idx)},550)},{passive:true});tile.addEventListener('touchend',()=>{clearTimeout(timer)},{passive:true});tile.addEventListener('touchmove',()=>{clearTimeout(timer)},{passive:true})})}
function startAlbumSelect(){selectMode=true;selectedPhotos=[];drawPhotos()}
function switchAlbum(a){isPickingPhotos=false;selectMode=false;selectedPhotos=[];state.activeAlbum=a;save();drawPhotos()}
function flash(t){let el=document.querySelector('#flashMsg');if(!el){el=document.createElement('div');el.id='flashMsg';el.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#171126;border:1px solid #8b3cff;color:#fff;border-radius:14px;padding:12px 18px;box-shadow:0 0 18px #873cff;z-index:999;font-weight:800;text-align:center';document.body.appendChild(el)}el.textContent=t;setTimeout(()=>{if(el)el.remove()},1800)}
function createAlbum(){const name=prompt('Album name?');if(!name)return;if(!state.albums.includes(name))state.albums.push(name);state.activeAlbum=name;save();drawPhotos()}
function photoSettings(){alert('Ghost Photos v0.6.3 Album Cards\\nStorage: stable device database\\nPhotos: '+state.photos.length+'\\nAlbums: '+state.albums.length)}
function albumOptions(album){if(album==='Library'||album==='All'||album==='All Photos')return;const modal=document.createElement('div');modal.className='albumModal';let buttons=`<button class="albumChoice" onclick="renameAlbum('${album}')">Rename Album</button><button class="albumChoice" onclick="changeAlbumCover('${album}')">Change Cover</button><button class="albumChoice" onclick="moveAlbumContents('${album}')">Move Contents</button>`;if(album!=='Library'&&album!=='Default')buttons+=`<button class="albumChoice" onclick="deleteAlbumFlow('${album}')">Delete Album</button>`;buttons+=`<button class="albumChoice" onclick="closeAlbumModal()">Cancel</button>`;modal.innerHTML=`<div class="albumModalCard"><h2>${albumEmoji(album)} ${album}</h2>${buttons}</div>`;document.body.appendChild(modal)}
function closeAlbumModal(){document.querySelectorAll('.albumModal,.cleanMenu,.menuDismiss').forEach(x=>x.remove())}
function renameAlbum(album){if(album==='Library')return alert('All cannot be renamed');const name=prompt('New album name?',album);if(!name||name===album)return;state.photos.forEach(p=>{if(p.album===album)p.album=name});state.albums=state.albums.map(a=>a===album?name:a);if(state.albumCovers[album]){state.albumCovers[name]=state.albumCovers[album];delete state.albumCovers[album]}state.activeAlbum=name;save();closeAlbumModal();drawPhotos()}
async function changeAlbumCover(album){const idxs=albumPhotoIndexes(album);if(!idxs.length)return alert('Add photos first');closeAlbumModal();const thumbs=await Promise.all(idxs.map(i=>photoSrc(i)));const modal=document.createElement('div');modal.className='albumModal';modal.innerHTML=`<div class="albumModalCard"><h2>Choose Cover</h2><div class="photoGridNew">${idxs.map((i,n)=>`<div class="photoTile" onclick="setAlbumCover('${album}',${i})"><img src="${thumbs[n]}"></div>`).join('')}</div><button class="albumChoice" onclick="closeAlbumModal()">Cancel</button></div>`;document.body.appendChild(modal)}
function setAlbumCover(album,i){state.albumCovers[album]=state.photos[i].id;save();closeAlbumModal();drawPhotos()}
function moveAlbumContents(album){if(album==='Library')return alert('Choose a specific album first');showAlbumPicker('album:'+album)}
function deleteAlbumFlow(album){const modal=document.querySelector('.albumModal');modal.innerHTML=`<div class="albumModalCard"><h2>Delete ${album}?</h2><button class="albumChoice" onclick="deleteAlbumConfirm('${album}','default')">Delete album only<br><small>Move photos to Default</small></button><button class="albumChoice" onclick="deleteAlbumConfirm('${album}','all')">Delete album and photos</button><button class="albumChoice" onclick="closeAlbumModal()">Cancel</button></div>`}
async function deleteAlbumConfirm(album,mode){if(mode==='all'){if(!confirm('Delete album and every photo inside?'))return;const ids=state.photos.filter(p=>p.album===album).map(p=>p.id);for(const id of ids){await dbDeletePhoto(id)}state.photos=state.photos.filter(p=>p.album!==album)}else{state.photos.forEach(p=>{if(p.album===album)p.album='Default'})}state.albums=state.albums.filter(a=>a!==album);delete state.albumCovers[album];state.activeAlbum='Library';save();closeAlbumModal();drawPhotos()}
function startSelectMode(i){selectMode=true;selectedPhotos=[i];drawPhotos()}
function exitSelectMode(){selectMode=false;selectedPhotos=[];drawPhotos()}
function togglePhotoSelect(i){if(selectedPhotos.includes(i))selectedPhotos=selectedPhotos.filter(x=>x!==i);else selectedPhotos.push(i);drawPhotos()}
async function deleteSelectedPhotos(){if(!selectedPhotos.length)return alert('Select photos first');if(!confirm('Delete selected photos?'))return;for(const i of selectedPhotos){if(state.photos[i]&&state.photos[i].id)await dbDeletePhoto(state.photos[i].id)}state.photos=state.photos.filter((_,i)=>!selectedPhotos.includes(i));save();exitSelectMode()}
function showAlbumPicker(mode){closeAlbumModal();const modal=document.createElement('div');modal.className='albumModal';modal.innerHTML=`<div class="albumModalCard"><h2>Move to album</h2>${state.albums.map(a=>`<button class="albumChoice" onclick="finishAlbumMove('${mode}','${a}')">${albumEmoji(a)} ${a}</button>`).join('')}<button class="albumChoice" onclick="createAlbumFromPicker('${mode}')">➕ Create New Album</button><button class="albumChoice" onclick="closeAlbumModal()">Cancel</button></div>`;document.body.appendChild(modal)}
function createAlbumFromPicker(mode){const name=prompt('New album name?');if(!name)return;if(!state.albums.includes(name))state.albums.push(name);finishAlbumMove(mode,name)}
function finishAlbumMove(mode,album){if(mode==='selected'){selectedPhotos.forEach(i=>state.photos[i].album=album);selectedPhotos=[];selectMode=false}else if(mode.startsWith('album:')){const source=mode.split(':')[1];state.photos.forEach(p=>{if(p.album===source)p.album=album});if(state.albumCovers[source]){state.albumCovers[album]=state.albumCovers[source]}}else{state.photos[currentPhoto].album=album}state.activeAlbum=album;save();closeAlbumModal();if(mode==='current')drawViewer();else drawPhotos()}

function renamePhoto(i){
  closeAlbumModal();
  const p=state.photos[i];
  if(!p)return;
  const current=photoName(p,i);
  const name=prompt('Rename photo',current);
  if(name===null)return;
  const clean=name.trim();
  if(!clean)return alert('Photo name cannot be blank');
  p.name=clean;
  save();
  flash('Photo renamed');
  if(!viewer.classList.contains('hidden')&&i===currentPhoto)drawViewer();else renderPhotoGridOnly();
}
async function drawViewer(){await ensurePhotoStorage();const idxs=filteredPhotoIndexes();let pos=idxs.indexOf(currentPhoto);if(pos<0)pos=0;const p=state.photos[currentPhoto];const src=await photoSrc(currentPhoto);viewer.className='viewerClean';viewer.innerHTML=`<div class="viewerCleanTop" id="viewerUI"><button onclick="closeViewer()">←</button><div class="viewerCount">${pos+1} / ${idxs.length||state.photos.length}<small>${escHtml(photoName(p,currentPhoto))}</small></div><button onclick="viewerMenu()">⋮</button></div><button class="viewerFav ${p.fav?'on':''}" onclick="toggleViewerFav()">${p.fav?'⭐':'☆'}</button><div class="viewerStage" id="viewerStage"><img id="viewerImg" src="${src}"></div>`;setupViewerGestures()}
function viewerMenu(){closeAlbumModal();const dismiss=document.createElement('div');dismiss.className='menuDismiss';dismiss.onclick=closeAlbumModal;const menu=document.createElement('div');menu.className='cleanMenu';menu.onclick=e=>e.stopPropagation();const fav=state.photos[currentPhoto]&&state.photos[currentPhoto].fav;menu.innerHTML=`<button onclick="toggleViewerFav();closeAlbumModal()">${fav?'⭐ Remove Favourite':'⭐ Add Favourite'}</button><button onclick="renamePhoto(${currentPhoto})">✏️ Rename Photo</button><button onclick="showAlbumPicker('current')">📁 Move Photo</button><button onclick="setCurrentAsCover()">⭐ Set Album Cover</button><button onclick="deletePhoto()">🗑 Delete Photo</button><button onclick="photoInfo()">ℹ Photo Info</button>`;document.body.appendChild(dismiss);document.body.appendChild(menu)}
function photoInfo(){const p=state.photos[currentPhoto];const d=p.created?new Date(p.created).toLocaleString():'Unknown';alert('Name: '+photoName(p,currentPhoto)+'\nAlbum: '+(p.album||'Default')+'\nFavourite: '+(p.fav?'Yes':'No')+'\nAdded: '+d+'\nPhoto '+(currentPhoto+1)+' of '+state.photos.length+'\nStorage: device database')}

function filesVault(){current='filesVault';shell(`<div class="appHead"><button class="back" onclick="vault()">←</button><h2>Private Files</h2></div><input type="file" multiple onchange="addFiles(this.files)" class="input"><div class="fileList">${state.files.map(f=>`<button>📄 ${f.name}<span style="margin-left:auto;color:#aaa">${Math.round(f.size/1024)}kb</span></button>`).join('')||'<p class="sub">No files yet.</p>'}</div>${nav()}`)}
function addFiles(files){[...files].forEach(f=>state.files.push({name:f.name,size:f.size,type:f.type}));save();filesVault()}
function notesVault(){current='notesVault';shell(`<div class="appHead"><button class="back" onclick="vault()">←</button><h2>Private Notes</h2></div><textarea id="newNote" class="noteArea" placeholder="Write a private note..."></textarea><button class="btn" onclick="state.notes.unshift(document.querySelector('#newNote').value);save();notesVault()">Save Note</button>${state.notes.map((n,i)=>`<div class="card" style="margin-top:12px">${n}<button class="btn danger" onclick="state.notes.splice(${i},1);save();notesVault()">Delete</button></div>`).join('')}${nav()}`)}
function contactsVault(){current='contacts';shell(`<div class="appHead"><button class="back" onclick="vault()">←</button><h2>Ghost Contacts</h2></div><input id="cName" class="input" placeholder="Name"><input id="cNum" class="input" style="margin-top:10px" placeholder="Number"><button class="btn" onclick="addContact()">Save Contact</button><h3 style="margin-top:18px">Saved Contacts</h3><div class="contactList">${state.contacts.map((c,i)=>`<button onclick="if(confirm('Delete contact?')){state.contacts.splice(${i},1);save();contactsVault()}">👤 ${c.name}<span style="margin-left:auto;color:#aaa">${c.num}</span></button>`).join('')||'<p class="sub">No contacts saved yet.</p>'}</div><p class="privacyNote">This web version stores contacts inside Ghost only.</p>${nav()}`)}
function addContact(){
  const nameEl=document.querySelector('#cName');
  const numEl=document.querySelector('#cNum');
  const name=(nameEl.value||'').trim();
  const num=(numEl.value||'').trim();
  if(!name || !num){alert('Add name and number');return;}
  state.contacts = state.contacts || [];
  state.contacts.push({name:name,num:num});
  save();
  flash('Contact added');
  contactsVault();
}
function browserVault(){current='browser';let hist=JSON.parse(localStorage.ghostBrowserHistoryV03||'[]');shell(`<div class="appHead"><button class="back" onclick="vault()">←</button><h2>Ghost Browser</h2></div><div class="browserBar"><input id="url" placeholder="Search Google or type URL"><button onclick="searchWeb()" class="btn" style="width:auto;margin:0;padding:12px 16px;border-radius:16px">Go</button></div><div class="webFrame"><div class="google">Google</div><div class="searchPill">Search opens in Chrome in this web version</div><h3>Ghost search history</h3>${hist.map(h=>`<p>↗ ${h}</p>`).join('')||'<p class="hint">No Ghost browser history yet.</p>'}</div><button class="btn danger" onclick="burnBrowser()">Burn Ghost Browser History</button><p class="privacyNote">Important: this cannot delete Chrome, Google account, phone provider, or other app history.</p>${nav()}`)}
function searchWeb(){let q=document.querySelector('#url').value.trim();if(!q)return;let hist=JSON.parse(localStorage.ghostBrowserHistoryV03||'[]');hist.unshift(q);localStorage.ghostBrowserHistoryV03=JSON.stringify(hist.slice(0,20));window.open('https://www.google.com/search?q='+encodeURIComponent(q),'_blank')}
function burnBrowser(){if(confirm('Delete Ghost browser history only?')){localStorage.removeItem('ghostBrowserHistoryV03');browserVault()}}
function settings(){current='settings';shell(`<div class="appHead"><button class="back" onclick="vault()">←</button><h2>Settings</h2></div><div class="card"><p>Disguise: <b>${state.disguise}</b></p><p>Emergency hide: <b style="color:#8dffb1">On</b></p></div><button class="btn dark" onclick="chooseDisguise()">Change Disguise</button><button class="btn dark" onclick="unlockSetup()">Change Unlock</button><button class="btn danger" onclick="resetApp()">Reset Setup</button>${nav()}`)}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&current!=='disguise'&&current!=='photos'&&!isPickingPhotos){setTimeout(()=>hideNow(),100)}});
window.addEventListener('pagehide',()=>{if(current!=='disguise'&&current!=='photos'&&!isPickingPhotos)hideNow()});
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
if(state.setupDone)disguiseApp();else welcome();
</script>
</body>
</html>
