<html lang="en">
<head>

<title>Ghost</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#05030b;--card:#11101cdd;--card2:#171126;--line:#7d32ff;--line2:#b067ff;--txt:#fff;--mut:#aaa6b8;--red:#ff514f;--green:#38d67a;--purple:#873cff;--glow:0 0 18px #873cff,0 0 38px #873cff55}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1e0b3c 0,#07030d 35%,#020204 100%);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--txt);min-height:100vh}button,input,textarea{font:inherit}.phone{max-width:430px;margin:0 auto;min-height:100vh;padding:22px 22px 30px;position:relative}.status{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:18px;margin-bottom:28px}.icons{letter-spacing:2px}.ghost{width:96px;height:96px;margin:0 auto 24px;display:block;filter:drop-shadow(0 0 18px #823cff)}.ghost.small{width:70px;height:70px}.title{text-align:center;font-size:43px;line-height:1.05;font-weight:900;margin:0}.grad{background:linear-gradient(180deg,#e7c8ff,#7a30ff);-webkit-background-clip:text;background-clip:text;color:transparent}.sub{text-align:center;color:#c5bfd2;font-size:18px;line-height:1.45;margin:16px auto 30px}.card{background:linear-gradient(160deg,#151126dd,#090713dd);border:1px solid #5a279966;border-radius:20px;padding:18px;box-shadow:inset 0 0 0 1px #ffffff08,0 10px 40px #0008}.feature{display:grid;grid-template-columns:64px 1fr;gap:18px;align-items:center;margin:18px 0}.feature .ico,.squareIco{width:58px;height:58px;border-radius:17px;background:#171126;border:1px solid #3b235c;display:grid;place-items:center;color:#a45cff;font-size:30px;box-shadow:0 0 18px #7434ff22}.feature h3{margin:0 0 5px;font-size:18px}.feature p{margin:0;color:#bdb6ca;line-height:1.3}.btn{width:100%;border:0;border-radius:22px;margin-top:24px;padding:21px 22px;background:linear-gradient(180deg,#a75bff,#6620ed);color:white;font-size:23px;font-weight:800;box-shadow:var(--glow);display:flex;justify-content:center;gap:20px;align-items:center}.foot{text-align:center;color:#9e96ad;margin-top:23px;line-height:1.35}.hidden{display:none!important}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.back{font-size:34px;color:#a35cff;background:0;border:0}.steps{display:flex;align-items:center;gap:13px}.step{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1px solid #56326e;color:#8e7ea7;font-weight:800}.step.done,.step.active{background:#8d49ff;color:#111;box-shadow:0 0 15px #8d49ff}.dash{width:24px;height:3px;background:#873cff;border-radius:5px;opacity:.8}.input{width:100%;padding:18px;border-radius:16px;background:#080610;border:2px solid #8b3cff;color:#fff;box-shadow:0 0 14px #843cff55;font-size:18px}.hint{color:#aaa2b7;margin:12px 0}.check{display:flex;gap:12px;align-items:center;color:#cfc8dc;margin:17px 0}.tick{width:28px;height:28px;border-radius:50%;background:#33145e;color:#b786ff;display:grid;place-items:center;font-weight:900}.option{display:grid;grid-template-columns:78px 1fr 36px;gap:14px;align-items:center;padding:13px;border:1px solid #351852;border-radius:18px;background:#0e0b18;margin:12px 0}.option.selected{border-color:#9b4dff;box-shadow:0 0 18px #8d3fff88}.miniIcon{width:66px;height:66px;border-radius:18px;background:#111;border:2px solid #913fff;box-shadow:0 0 13px #873cff;display:grid;place-items:center;overflow:hidden}.miniIcon img{width:100%;height:100%;object-fit:cover}.radio{width:28px;height:28px;border-radius:50%;border:3px solid #67557b}.selected .radio{background:#a358ff;border-color:#a358ff;box-shadow:0 0 15px #a358ff}.option h3{margin:0 0 5px;font-size:22px}.option p{margin:0;color:#b8b1c5}.stars{color:#8e44ff;font-size:17px;margin-top:7px}.layoutPreview{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px}.layoutPreview span{font-size:16px;color:#a660ff}.toggleRow{display:grid;grid-template-columns:64px 1fr 60px;align-items:center;gap:14px;padding:13px;margin:10px 0;border-radius:18px;background:#100d1b;border:1px solid #2c164c}.toggle{width:55px;height:31px;border-radius:99px;background:#2a2036;padding:3px}.toggle.on{background:linear-gradient(90deg,#6920e8,#bf70ff)}.knob{width:25px;height:25px;border-radius:50%;background:white;margin-left:0}.toggle.on .knob{margin-left:24px}.appHead{display:flex;align-items:center;gap:12px;margin-bottom:18px}.appHead img{width:42px;height:42px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.vaultBtn{border-radius:18px;background:#11101c;border:1px solid #2c164c;padding:18px 8px;text-align:center;min-height:100px}.vaultBtn .big{font-size:31px;color:#a258ff;margin-bottom:8px}.nav{position:sticky;bottom:0;margin:20px -8px -8px;padding:10px;background:#090611d9;border:1px solid #2e164d;border-radius:22px;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;backdrop-filter:blur(12px)}.nav button{background:0;border:0;color:#bdb5ca;font-size:12px}.nav .nI{display:block;font-size:24px;color:#8f45ff}.calcDisplay{height:92px;border-radius:20px;background:#05050a;border:1px solid #35204d;margin-bottom:14px;padding:18px;text-align:right;font-size:38px;overflow:hidden}.calcGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.calcGrid button{height:64px;border:0;border-radius:18px;background:#1b1a23;color:white;font-size:24px;font-weight:700}.calcGrid .op{background:#33234b;color:#c79bff}.calcGrid .eq{background:linear-gradient(180deg,#974eff,#611ee4)}.fakeTitle{text-align:center;font-weight:800;font-size:22px;margin-bottom:15px}.noteArea{width:100%;min-height:260px;border-radius:18px;background:#10101a;border:1px solid #35204d;color:white;padding:16px;resize:vertical}.fileList button,.contactList button{width:100%;text-align:left;border:0;border-radius:16px;background:#11101c;color:white;padding:16px;margin:8px 0;display:flex;gap:12px;align-items:center}.calendarGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{height:42px;border-radius:12px;background:#11101c;border:1px solid #231339;color:white}.day.sel{background:#8b3cff}.weatherCards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.wCard{border:1px solid #2c164c;background:#11101c;border-radius:18px;padding:18px;text-align:center}.browserBar{display:flex;gap:8px;margin:12px 0}.browserBar input{flex:1;background:#15151e;border:1px solid #3b235c;border-radius:16px;color:white;padding:13px}.burn{background:#441715!important;color:#ff8579!important}.webFrame{height:420px;border-radius:18px;background:#0e0e16;border:1px solid #2c164c;overflow:auto;padding:20px}.google{text-align:center;font-size:46px;font-weight:800;margin:45px 0 25px}.burnPage{text-align:center}.flame{font-size:80px;color:#ff514f;filter:drop-shadow(0 0 15px #ff514f)}.progressCircle{width:180px;height:180px;border-radius:50%;border:10px solid #33202a;border-top-color:#ff514f;margin:40px auto;display:grid;place-items:center;font-size:45px;font-weight:900}.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#171126;border:1px solid #8b3cff;color:white;border-radius:14px;padding:12px 18px;box-shadow:var(--glow);z-index:20}.privacyNote{font-size:13px;color:#958aa6;text-align:center;margin-top:12px}.picGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.picGrid img{width:100%;aspect-ratio:1;border-radius:12px;object-fit:cover}.danger{background:#ff514f!important}.searchPill{background:#20202b;border-radius:24px;padding:15px;color:#a8a2b5;text-align:left;margin:12px 0}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.quick span{display:grid;place-items:center;background:#151520;border-radius:50%;height:56px;font-size:23px}.label{font-size:12px;color:#aaa;text-align:center;margin-top:6px}.screen{animation:fade .2s}@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="app" class="phone"></div>
<div id="toast" class="toast hidden"></div>
<script>
const ghostSVG='data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f0d8ff"/><stop offset="1" stop-color="#6525ff"/></linearGradient></defs><path d="M50 165V82c0-39 23-62 50-62s50 23 50 62v83c-10 0-15-12-25-12s-15 16-25 16-15-16-25-16-15 12-25 12z" fill="url(#g)"/><ellipse cx="80" cy="84" rx="12" ry="20" fill="#080514"/><ellipse cx="120" cy="84" rx="12" ry="20" fill="#080514"/><ellipse cx="100" cy="121" rx="8" ry="6" fill="#080514"/></svg>`);
const $=q=>document.querySelector(q), app=$('#app');
let state=JSON.parse(localStorage.ghostState||'{}');
state.secret=state.secret||'7777='; state.disguise=state.disguise||'calculator'; state.dashboard=state.dashboard||'vault'; state.protect=state.protect||{photos:true,videos:true,documents:true,browser:true,contacts:true,chats:true,notes:true,passwords:true,voice:true,other:true}; state.notes=state.notes||[]; state.files=state.files||[]; state.contacts=state.contacts||[]; state.photos=state.photos||[]; state.unlockCalendar=state.unlockCalendar||['28']; state.unlockWeather=state.unlockWeather||['sun','cloud','rain'];
function save(){localStorage.ghostState=JSON.stringify(state)}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),1800)}
function shell(inner){app.innerHTML=`<div class="screen"><div class="status"><span>9:41</span><span class="icons">▮▮▮ ᯤ ▭</span></div>${inner}</div>`}
function ghost(cls=''){return `<img class="ghost ${cls}" src="${ghostSVG}">`}
function steps(n,total=5){let s='<div class="topbar"><button class="back" onclick="historyBack()">←</button><div class="steps">';for(let i=1;i<=total;i++){s+=`<div class="step ${i<n?'done':i==n?'active':''}">${i<n?'✓':i}</div>`; if(i<total)s+='<div class="dash"></div>'}return s+'</div></div>'}
let backStack=[]; function go(name){backStack.push(current); routes[name]()} let current='welcome'; function historyBack(){ if(backStack.length){let n=backStack.pop(); routes[n]()} else routes.welcome() }
function setCurrent(n){current=n}
const routes={
welcome(){setCurrent('welcome');shell(`${ghost()}<h1 class="title">Welcome to<br><span class="grad">GHOST</span></h1><p class="sub">Your private vault for everything that matters.</p><div class="feature"><div class="ico">♢</div><div><h3>Truly Private</h3><p>Your vault is encrypted locally on your device.</p></div></div><div class="feature"><div class="ico">◉</div><div><h3>Disguised as Anything</h3><p>Hide Ghost behind calculator, notes, weather and more.</p></div></div><div class="feature"><div class="ico">▣</div><div><h3>You're in Control</h3><p>Only you can access your vault with your secret action.</p></div></div><button class="btn" onclick="routes.secret()">Get Started <span>→</span></button><div class="foot">▣ No sign up. No tracking. No cloud.<br>Just privacy.</div>`)} ,
secret(){setCurrent('secret');shell(`${steps(2)}${ghost('small')}<h1 class="title">Choose your<br><span class="grad">secret word</span></h1><p class="sub">This is your key to Ghost. Use a word or number.</p><div class="card feature"><div class="ico">♢</div><div><h3>Keep it secret</h3><p>No one else should know your secret word or number.</p></div></div><div class="hint">SECRET WORD OR NUMBER</div><input id="secretIn" class="input" placeholder="Enter your secret word or number" value="${state.secret}"><div class="check"><span class="tick">✓</span>Be at least 4 characters or numbers</div><div class="check"><span class="tick">✓</span>Be something only you can remember</div><div class="check"><span class="tick">✓</span>Not be easy to guess</div><button class="btn" onclick="saveSecret()">Continue <span>→</span></button><div class="foot">▣ Your secret word is never sent anywhere.</div>`)} ,
disguise(){setCurrent('disguise');const icons={calculator:'🧮',weather:'🌤️',files:'📁',notes:'🗒️',calendar:'📅'};shell(`${steps(3)}${ghost('small')}<h1 class="title">Choose your<br><span class="grad">disguise</span></h1><p class="sub">Ghost will appear as this app on your device.</p>${['calculator','weather','files','notes','calendar'].map(k=>`<div class="option ${state.disguise==k?'selected':''}" onclick="state.disguise='${k}';save();routes.disguise()"><div class="miniIcon">${icons[k]}</div><div><h3>${k[0].toUpperCase()+k.slice(1)}</h3><p>Looks like a ${k} app</p><div class="stars">${k=='calculator'?'★★★★★':k=='weather'||k=='files'?'★★★★☆':'★★★☆☆'}</div></div><div class="radio"></div></div>`).join('')}<button class="btn" onclick="routes.dashboardChoice()">Continue <span>→</span></button><div class="foot">You can change your disguise anytime.</div>`)} ,
dashboardChoice(){setCurrent('dashboardChoice'); const opts=[['vault','Vault Dashboard','Everything you need, all in one place.','📷 🎥 📄 💬 👤 🌐 📝 🔑 ⚙️'],['minimal','Minimal Dashboard','Clean and simple. Focus on essentials.','📷 🎥 📄 📝'],['privacy','Privacy Dashboard','Built for privacy. Keep what matters safe.','🔑 💬 🌐 👤 📝 ⚙️'],['business','Business Dashboard','Organized for productivity.','📄 📝 🔑 📷 🎥 👤'],['custom','Custom Dashboard','Choose exactly what appears.','＋']]; shell(`${steps(4)}${ghost('small')}<h1 class="title">Choose your<br><span class="grad">dashboard</span></h1><p class="sub">This is what you'll see inside your vault.</p>${opts.map(o=>`<div class="option ${state.dashboard==o[0]?'selected':''}" onclick="state.dashboard='${o[0]}';save();routes.dashboardChoice()"><div class="miniIcon layoutPreview">${o[3].split(' ').map(x=>`<span>${x}</span>`).join('')}</div><div><h3>${o[1]}</h3><p>${o[2]}</p></div><div class="radio"></div></div>`).join('')}<button class="btn" onclick="routes.protect()">Continue <span>→</span></button><div class="foot">You can customize it anytime.</div>`)} ,
protect(){setCurrent('protect'); const rows=[['photos','▧','Photos','Keep your private photos secure'],['videos','▷','Videos','Protect your private videos'],['documents','▤','Documents','Secure important files'],['browser','◎','Browser Data','Hide browsing history and bookmarks'],['contacts','♙','Contacts','Protect private contacts'],['chats','☏','Saved Chats','Secure conversations'],['notes','☷','Notes','Keep private notes'],['passwords','▣','Passwords','Store passwords safely'],['voice','♬','Voice Notes','Protect recordings'],['other','▭','Other Files','Any other files you want to hide']]; shell(`${steps(5)}${ghost('small')}<h1 class="title">Choose what to <span class="grad">protect</span></h1><p class="sub">Select the types of data you want private.</p>${rows.map(r=>`<div class="toggleRow" onclick="state.protect.${r[0]}=!state.protect.${r[0]};save();routes.protect()"><div class="squareIco">${r[1]}</div><div><h3 style="margin:0">${r[2]}</h3><p style="margin:5px 0 0;color:#b8b1c5">${r[3]}</p></div><div class="toggle ${state.protect[r[0]]?'on':''}"><div class="knob"></div></div></div>`).join('')}<button class="btn" onclick="routes.created()">Create Vault <span>→</span></button><div class="foot">Your data is encrypted locally.</div>`)} ,
created(){setCurrent('created'); save(); shell(`${ghost()}<h1 class="title">Vault <span class="grad">created</span></h1><p class="sub">Ghost is ready. Your disguise is <b>${state.disguise}</b>.</p><div class="card"><p>Disguise: <b>${state.disguise}</b></p><p>Unlock: <b>${state.secret}</b></p><p>Status: <b style="color:#8dffb1">Invisible</b></p></div><button class="btn" onclick="routes.disguiseApp()">Enter Disguise <span>→</span></button><button class="btn" style="background:#151126" onclick="unlock()">Open Vault Now</button>`)},
disguiseApp(){setCurrent('disguiseApp'); if(state.disguise==='calculator') return calc(); if(state.disguise==='notes') return notesDisguise(); if(state.disguise==='files') return filesDisguise(); if(state.disguise==='calendar') return calendarDisguise(); return weatherDisguise()},
vault(){setCurrent('vault'); shell(`<div class="appHead"><img src="${ghostSVG}"><h2>Ghost Vault</h2><button style="margin-left:auto" class="back" onclick="routes.disguiseApp()">×</button></div><div class="grid"><div class="vaultBtn" onclick="routes.photos()"><div class="big">▧</div>Photos</div><div class="vaultBtn" onclick="routes.filesVault()"><div class="big">▤</div>Files</div><div class="vaultBtn" onclick="routes.ghostBrowser()"><div class="big">◎</div>Browser</div><div class="vaultBtn" onclick="routes.notesVault()"><div class="big">☷</div>Notes</div><div class="vaultBtn" onclick="routes.contacts()"><div class="big">♙</div>Contacts</div><div class="vaultBtn" onclick="routes.burnAll()"><div class="big">🔥</div>Burn</div></div>${nav()}`)},
photos(){setCurrent('photos');shell(`<div class="appHead"><button class="back" onclick="routes.vault()">←</button><h2>Private Photos</h2></div><input type="file" accept="image/*" multiple onchange="addPhotos(this.files)" class="input"><div class="picGrid" style="margin-top:18px">${state.photos.map((p,i)=>`<img src="${p}" onclick="if(confirm('Delete photo?')){state.photos.splice(${i},1);save();routes.photos()}">`).join('')}</div>${nav()}`)},
filesVault(){setCurrent('filesVault');shell(`<div class="appHead"><button class="back" onclick="routes.vault()">←</button><h2>Private Files</h2></div><input type="file" multiple onchange="addFiles(this.files)" class="input"><div class="fileList">${state.files.map((f,i)=>`<button onclick="toast('Stored privately in Ghost')">📄 ${f.name}<span style="margin-left:auto;color:#aaa">${Math.round(f.size/1024)}kb</span></button>`).join('')||'<p class="sub">No files yet.</p>'}</div>${nav()}`)},
notesVault(){setCurrent('notesVault');shell(`<div class="appHead"><button class="back" onclick="routes.vault()">←</button><h2>Private Notes</h2></div><textarea id="newNote" class="noteArea" placeholder="Write a private note..."></textarea><button class="btn" onclick="state.notes.unshift($('#newNote').value);save();routes.notesVault()">Save Note</button>${state.notes.map((n,i)=>`<div class="card" style="margin-top:12px" onclick="if(confirm('Burn this note?')){state.notes.splice(${i},1);save();routes.notesVault()}">${n}</div>`).join('')}${nav()}`)},
contacts(){setCurrent('contacts');shell(`<div class="appHead"><button class="back" onclick="routes.vault()">←</button><h2>Ghost Contacts</h2></div><input id="cName" class="input" placeholder="Name"><input id="cNum" class="input" style="margin-top:10px" placeholder="Number"><button class="btn" onclick="addContact()">Add Contact</button><div class="contactList">${state.contacts.map(c=>`<button onclick="location.href='sms:${c.num}'">👤 ${c.name}<span style="margin-left:auto;color:#aaa">SMS</span></button>`).join('')}</div><p class="privacyNote">SMS opens your phone's normal messaging. Ghost can store contact details, but it cannot erase your phone provider's SMS records.</p>${nav()}`)},
ghostBrowser(){setCurrent('ghostBrowser'); let hist=JSON.parse(localStorage.ghostBrowserHistory||'[]'); shell(`<div class="appHead"><div class="squareIco">◎</div><h2>Ghost Browser</h2><button class="back burn" onclick="routes.burnBrowser()">🔥</button></div><div class="browserBar"><input id="url" placeholder="Search Google or type URL"><button onclick="searchWeb()" class="btn" style="width:auto;margin:0;padding:12px 16px;border-radius:16px">Go</button></div><div class="webFrame"><div class="google">Google</div><div class="searchPill">Search or type URL</div><div class="quick"><div><span>▶️</span><div class="label">YouTube</div></div><div><span>✉️</span><div class="label">Gmail</div></div><div><span>🗺️</span><div class="label">Maps</div></div><div><span>＋</span><div class="label">Add</div></div></div><h3>History inside Ghost</h3>${hist.map(h=>`<p>↗ ${h}</p>`).join('')||'<p class="hint">No Ghost browser history yet.</p>'}</div>${nav()}`)},
burnBrowser(){setCurrent('burnBrowser'); shell(`<div class="burnPage"><button class="back" onclick="routes.ghostBrowser()">×</button><div class="flame">🔥</div><h1>Burn everything?</h1><p class="sub">This deletes Ghost Browser data stored inside this app.</p><div class="card" style="text-align:left"><p>✓ Search history</p><p>✓ Cookies and site data</p><p>✓ Open tabs</p><p>✓ Bookmarks</p><p>✓ Cached pages</p><p>✓ Downloads list</p></div><button class="btn danger" onmousedown="burnHold()" ontouchstart="burnHold()">Hold to Burn →</button><p class="privacyNote">This cannot delete history from Chrome, Safari or other apps.</p></div>`)},
burnAll(){setCurrent('burnAll');shell(`<div class="burnPage"><button class="back" onclick="routes.vault()">×</button><div class="flame">🔥</div><h1>Emergency Burn</h1><p class="sub">Choose what to delete from Ghost.</p><button class="btn danger" onclick="if(confirm('Delete browser data?')){localStorage.removeItem('ghostBrowserHistory');toast('Browser burned')} ">Burn Browser</button><button class="btn danger" onclick="if(confirm('Delete all notes?')){state.notes=[];save();toast('Notes burned')} ">Burn Notes</button><button class="btn" onclick="routes.disguiseApp()">Instant Ghost Mode</button></div>`) }
};
function saveSecret(){const v=$('#secretIn').value.trim(); if(v.length<4)return toast('Use at least 4 characters'); state.secret=v; save(); routes.disguise()}
function unlock(){routes.vault()}
function nav(){return `<div class="nav"><button onclick="routes.vault()"><span class="nI">⌂</span>Home</button><button onclick="routes.ghostBrowser()"><span class="nI">◎</span>Browser</button><button onclick="routes.photos()"><span class="nI">▧</span>Photos</button><button onclick="routes.notesVault()"><span class="nI">☷</span>Notes</button><button onclick="routes.disguiseApp()"><span class="nI">◌</span>Hide</button></div>`}
let calcVal=''; function calc(){shell(`<div class="fakeTitle">Calculator</div><div class="calcDisplay" id="display">0</div><div class="calcGrid">${['C','÷','×','⌫','7','8','9','-','4','5','6','+','1','2','3','=','0','.','%','GO'].map(x=>`<button class="${'+-×÷='.includes(x)||x=='GO'?'op':''} ${x=='='?'eq':''}" onclick="calcPress('${x}')">${x}</button>`).join('')}</div><p class="privacyNote">Tip: enter your secret code to unlock Ghost.</p>`) }
function calcPress(x){if(x==='C')calcVal=''; else if(x==='⌫')calcVal=calcVal.slice(0,-1); else if(x==='GO'||x==='='){ if(calcVal+x===state.secret||calcVal===state.secret.replace('=','')) return unlock(); try{calcVal=String(Function('return '+calcVal.replaceAll('×','*').replaceAll('÷','/').replace('%','/100'))())}catch(e){calcVal='Error'} } else calcVal+=x; $('#display').textContent=calcVal||'0'}
function notesDisguise(){shell(`<div class="fakeTitle">Notes</div><textarea id="dnote" class="noteArea" placeholder="Start typing..."></textarea><button class="btn" onclick="checkNote()">Save</button><p class="privacyNote">This is a working decoy notepad.</p>`)} function checkNote(){let v=$('#dnote').value; if(v.includes(state.secret)) unlock(); else toast('Note saved')}
function filesDisguise(){shell(`<div class="fakeTitle">Files</div><div class="fileList">${['Downloads','Pictures','Documents','Music','Invoices 2026'].map(f=>`<button onclick="fileOpen('${f}')">📁 ${f}</button>`).join('')}</div>`) } function fileOpen(f){ if(f==='Invoices 2026'||f.toLowerCase().includes(state.secret.toLowerCase())) unlock(); else toast('Folder opened')}
function calendarDisguise(){let d=new Date(),days=Array.from({length:31},(_,i)=>i+1); shell(`<div class="fakeTitle">Calendar</div><h2 style="text-align:center">${d.toLocaleString('default',{month:'long'})} ${d.getFullYear()}</h2><div class="calendarGrid">${days.map(day=>`<button class="day" onclick="calTap('${day}')">${day}</button>`).join('')}</div><p class="privacyNote">Tap your secret date to unlock.</p>`)} function calTap(day){ if(day==state.secret||day==='28') unlock(); else toast('Date selected')}
let weatherSeq=[]; function weatherDisguise(){shell(`<div class="fakeTitle">Weather</div><div class="card" style="text-align:center"><div style="font-size:72px">🌤️</div><h1>18°C</h1><p>Partly cloudy</p></div><div class="weatherCards"><div class="wCard" onclick="weatherTap('sun')">☀️<br>Sun</div><div class="wCard" onclick="weatherTap('cloud')">☁️<br>Cloud</div><div class="wCard" onclick="weatherTap('rain')">🌧️<br>Rain</div><div class="wCard" onclick="weatherTap('storm')">⛈️<br>Storm</div></div><p class="privacyNote">Tap your secret weather pattern to unlock.</p>`)} function weatherTap(w){weatherSeq.push(w); if(weatherSeq.join(',').endsWith(state.unlockWeather.join(','))) unlock(); else toast(w)}
function addPhotos(files){[...files].forEach(f=>{let r=new FileReader(); r.onload=e=>{state.photos.push(e.target.result);save();routes.photos()}; r.readAsDataURL(f)})}
function addFiles(files){[...files].forEach(f=>state.files.push({name:f.name,size:f.size,type:f.type}));save();routes.filesVault()}
function addContact(){let name=$('#cName').value,num=$('#cNum').value;if(!name||!num)return toast('Add name and number');state.contacts.push({name,num});save();routes.contacts()}
function searchWeb(){let q=$('#url').value.trim(); if(!q)return; let hist=JSON.parse(localStorage.ghostBrowserHistory||'[]'); hist.unshift(q); localStorage.ghostBrowserHistory=JSON.stringify(hist.slice(0,20)); window.open('https://www.google.com/search?q='+encodeURIComponent(q),'_blank'); toast('Opened search')}
function burnHold(){setTimeout(()=>{localStorage.removeItem('ghostBrowserHistory'); shell(`<div class="burnPage"><div style="font-size:85px;color:#39d77d">🛡️</div><h1>Everything is gone.</h1><p class="sub">Ghost Browser data has been deleted.</p><button class="btn" onclick="routes.ghostBrowser()">Done</button></div>`)},900)}
document.addEventListener('visibilitychange',()=>{ if(document.hidden && current!=='disguiseApp') { current='disguiseApp'; setTimeout(()=>routes.disguiseApp(),100)} });
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
routes.welcome();
</script>
